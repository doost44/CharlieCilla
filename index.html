<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charlie Cilla</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="site-theme.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      .home-shell {
        min-height: 100vh;
      }

      .hero-wordmark {
        margin: 8px 0 32px;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: clamp(32px, 10vw, 150px);
        line-height: 0.9;
        letter-spacing: -3px;
        text-transform: uppercase;
        font-weight: 900;
        color: #fff;
        text-shadow: 0 2px 24px rgba(0, 0, 0, 0.6);
        white-space: nowrap;
      }

      .hero-wordmark .accent-stroke {
        -webkit-text-stroke: 1.5px var(--accent);
        color: transparent;
      }

      .home-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 24px;
      }

      .filter-tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .filter-tab {
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(0, 0, 0, 0.35);
        color: #e8e8e8;
        padding: 8px 14px;
        font-size: 10px;
        letter-spacing: 1.8px;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: var(--mono);
        border-radius: 2px;
      }

      .filter-tab:hover {
        border-color: rgba(255, 255, 255, 0.7);
        color: #fff;
      }

      .filter-tab.is-active {
        background: var(--accent);
        color: #000;
        border-color: var(--accent);
      }

      .home-project-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 28px;
      }

      .home-card {
        text-align: left;
        display: flex;
        flex-direction: column;
        cursor: pointer;
        color: inherit;
        background: rgba(8, 8, 8, 0.42);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition:
          border-color 0.2s ease,
          transform 0.2s ease,
          background 0.2s ease;
        overflow: hidden;
        padding: 0;
        font: inherit;
      }

      .home-card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
        background: rgba(12, 12, 12, 0.6);
      }

      .home-card-media {
        width: 100%;
        aspect-ratio: 16 / 10;
        overflow: hidden;
        background: #050505;
        position: relative;
      }

      .home-card-media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .home-card-media-fallback {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        color: #888;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .home-card-body {
        padding: 18px 20px 22px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .home-card-meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .home-card-title {
        margin: 0;
        font-size: clamp(22px, 2.4vw, 34px);
        line-height: 1;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        text-transform: uppercase;
        font-weight: 900;
        letter-spacing: -0.5px;
        color: #fff;
      }

      .home-card-index {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 2px;
        color: var(--accent);
        text-transform: uppercase;
      }

      .home-card-text {
        margin: 0;
        color: #b8b8b8;
        line-height: 1.5;
        font-size: 13px;
      }

      .home-empty {
        border: 1px dashed rgba(255, 255, 255, 0.2);
        padding: 40px;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #9a9a9a;
        font-size: 12px;
        font-family: var(--mono);
        grid-column: 1 / -1;
      }

      .project-modal {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: rgba(0, 0, 0, 0.92);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        display: grid;
        place-items: start center;
        padding: clamp(20px, 3vh, 40px) clamp(16px, 2vw, 32px);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.26s ease;
        overflow-y: auto;
      }

      .project-modal.is-open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      .modal-close {
        position: fixed;
        top: 24px;
        right: 28px;
        width: 44px;
        height: 44px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        background: rgba(0, 0, 0, 0.65);
        color: white;
        font-size: 14px;
        cursor: pointer;
        font-family: var(--mono);
        z-index: 110;
      }

      .modal-close:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .modal-content {
        width: 100%;
        max-width: 1480px;
        padding: clamp(16px, 1.8vw, 24px) clamp(16px, 1.8vw, 24px)
          clamp(20px, 2.4vw, 32px);
        display: grid;
        gap: clamp(24px, 3vw, 44px);
        background: rgba(6, 6, 6, 0.5);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        margin: auto;
      }

      .modal-header {
        padding: 0 0 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        display: grid;
        gap: 8px;
      }

      .modal-meta {
        text-transform: uppercase;
        letter-spacing: 2.4px;
        font-size: 11px;
        color: var(--accent);
      }

      .modal-title {
        margin: 0;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: clamp(22px, 2.8vw, 42px);
        line-height: 1;
        text-transform: uppercase;
        font-weight: 900;
        letter-spacing: -1px;
      }

      .modal-description {
        margin: 0;
        color: #cecece;
        line-height: 1.7;
        max-width: 70ch;
      }

      .modal-credit {
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #bdbdbd;
      }

      .modal-media-video {
        position: relative;
        padding-bottom: 56.25%;
        height: 0;
        overflow: hidden;
      }

      .modal-media-video iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .modal-media-images img {
        width: 100%;
        display: block;
        margin-bottom: 8px;
      }

      .modal-media-flipbook {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 4px;
      }

      .modal-media-flipbook > [id^="flipbook-"] {
        max-width: 100%;
      }

      .home-flipbook-controls {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .home-flipbook-controls button {
        border: 1px solid rgba(255, 255, 255, 0.5);
        background: transparent;
        color: white;
        padding: 8px 14px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1.6px;
        cursor: pointer;
        font-family: var(--mono);
      }

      .home-flipbook-page-info {
        color: #bdbdbd;
        font-size: 11px;
        font-family: var(--mono);
        letter-spacing: 1.5px;
      }

      body.modal-open {
        overflow: hidden;
      }

      @media (max-width: 820px) {
        .home-project-grid {
          grid-template-columns: 1fr;
          gap: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="site-bg" aria-hidden="true">
      <video class="site-bg-video" autoplay muted loop playsinline>
        <source src="Assets/tree-background.mp4" type="video/mp4" />
      </video>
      <div class="site-bg-overlay"></div>
      <div class="site-bg-grain"></div>
      <div class="site-bg-fade"></div>
    </div>

    <header class="site-header">
      <div class="header-content">
        <img src="logo.png" alt="Logo" class="logo" />
        <h1 class="brand-title">CHARLIE CILLA</h1>
      </div>
      <ul class="site-nav">
        <li><a href="index.html" class="is-active">HOME</a></li>
        <li><a href="pages_code/page_portfolio.html">ARCHIVES</a></li>
        <li><a href="pages_code/page_contact.html">CONTACT</a></li>
        <li><a href="pages_code/page_about.html">ABOUT</a></li>
        <li><a href="pages_code/page_projects.html">PROJECTS</a></li>
      </ul>
    </header>

    <main id="central-portfolio-section" class="page-shell home-shell"></main>

    <div
      id="project-modal"
      class="project-modal"
      onclick="if (event.target === this) closeProject();"
    >
      <button
        class="modal-close"
        type="button"
        onclick="closeProject()"
        aria-label="Close"
      >
        X
      </button>
      <div class="modal-content"></div>
    </div>

    <footer class="site-footer">&copy; 2026 Charlie Cilla</footer>

    <link rel="stylesheet" href="admin/admin.css" />
    <script src="admin/data.js"></script>
    <script src="admin/admin.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="pages_code/Handbook_Files/flipbook-viewer-master/dist/flipbook-viewer.js"></script>

    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      let homeProjectCache = {};
      let activeFilter = "all";
      const homeViewers = {};

      function categoryGroup(category) {
        const c = (category || "").toUpperCase();
        if (c.includes("FILM") || c.includes("DOC") || c.includes("VIDEO")) {
          return "film";
        }
        if (
          c.includes("PRINT") ||
          c.includes("EDITORIAL") ||
          c.includes("PUBLICATION") ||
          c.includes("BOOK")
        ) {
          return "publication";
        }
        return "other";
      }

      function stripHtml(input) {
        return (input || "")
          .replace(/<[^>]*>/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function youtubeIdFromProject(project) {
        if (project.youtubeId) return project.youtubeId;
        const value = String(project.youtubeUrl || project.youtube || "");
        const match = value.match(
          /(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{6,})/,
        );
        return match ? match[1] : "";
      }

      function normalizeFlipbookPath(path) {
        if (!path) return path;
        if (/^(https?:|data:|blob:)/i.test(path)) return path;
        if (path.startsWith("/")) return path;
        if (path.startsWith("pages_code/")) return path;
        if (path.startsWith("Handbook_Files/")) return `pages_code/${path}`;
        if (path.startsWith("../")) return path.replace(/^\.\.\//, "");
        if (path.startsWith("./")) return path.replace(/^\.\//, "");
        return path;
      }

      function previewForProject(project) {
        if (project.type === "video") {
          const youtubeId = youtubeIdFromProject(project);
          return youtubeId
            ? `https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg`
            : "";
        }

        if (Array.isArray(project.images) && project.images.length > 0) {
          return normalizeFlipbookPath(project.images[0]);
        }

        if (project.flipbookImages) {
          const pages = Array.isArray(project.flipbookImages.pages)
            ? project.flipbookImages.pages.filter(
                (p) => typeof p === "string" && p.trim(),
              )
            : [];

          if (pages.length > 0) {
            return normalizeFlipbookPath(pages[0]);
          }

          const basePath = normalizeFlipbookPath(
            project.flipbookImages.basePath || "",
          );
          const ext = project.flipbookImages.extension || ".png";
          return `${basePath}01${ext}`;
        }

        return "";
      }

      function renderHomePage() {
        const projects = AdminData.getHomeProjects().filter(
          (p) => p.visible !== false,
        );
        homeProjectCache = {};
        projects.forEach((p) => {
          homeProjectCache[p.id] = p;
        });

        const counts = {
          all: projects.length,
          film: projects.filter((p) => categoryGroup(p.category) === "film")
            .length,
          publication: projects.filter(
            (p) => categoryGroup(p.category) === "publication",
          ).length,
        };

        const shell = document.getElementById("central-portfolio-section");
        shell.innerHTML = `
          <div class="meta-strip">
            <div>Charlie Cilla / Designer + Filmmaker<br />Featured Selection 2026</div>
            <div>Film / Publication<br />Creative Direction</div>
            <div>Stories and systems told through visual form.</div>
          </div>
          <h2 class="hero-wordmark"><span class="accent-stroke">Selected</span> Works</h2>
          <div class="home-controls">
            <div class="filter-tabs">
              <button class="filter-tab" type="button" data-filter="all">All (${counts.all})</button>
              <button class="filter-tab" type="button" data-filter="film">Films (${counts.film})</button>
              <button class="filter-tab" type="button" data-filter="publication">Publications (${counts.publication})</button>
            </div>
            <span class="filter-tab" style="pointer-events:none;border-color:transparent;background:transparent;color:#8a8a8a;">// Click any project to open</span>
          </div>
          <section class="home-project-grid" id="home-project-grid"></section>
        `;

        shell.querySelectorAll(".filter-tab[data-filter]").forEach((btn) => {
          btn.addEventListener("click", () => {
            activeFilter = btn.dataset.filter;
            renderProjectRows();
          });
        });

        renderProjectRows();
      }

      function renderProjectRows() {
        document.querySelectorAll(".filter-tab[data-filter]").forEach((tab) => {
          tab.classList.toggle(
            "is-active",
            tab.dataset.filter === activeFilter,
          );
        });

        const allProjects = Object.values(homeProjectCache);
        const visibleProjects =
          activeFilter === "all"
            ? allProjects
            : allProjects.filter(
                (p) => categoryGroup(p.category) === activeFilter,
              );

        const gridEl = document.getElementById("home-project-grid");
        if (!gridEl) return;

        if (!visibleProjects.length) {
          gridEl.innerHTML =
            '<div class="home-empty">No projects in this category yet.</div>';
          return;
        }

        gridEl.innerHTML = visibleProjects
          .map((project, idx) => {
            const projectExcerpt = stripHtml(project.description || "");
            const shortText = projectExcerpt
              ? `${projectExcerpt.slice(0, 140)}${projectExcerpt.length > 140 ? "..." : ""}`
              : "Project details coming soon.";
            const preview = previewForProject(project);
            const idxLabel = String(idx + 1).padStart(2, "0");

            return `
              <button type="button" class="home-card" data-project-id="${project.id}">
                <div class="home-card-media">
                  ${
                    preview
                      ? `<img src="${preview}" alt="${project.title || "Project"}" loading="lazy" />`
                      : '<div class="home-card-media-fallback">No Preview</div>'
                  }
                </div>
                <div class="home-card-body">
                  <div class="home-card-meta">
                    <span class="home-card-index">${idxLabel} / ${String(visibleProjects.length).padStart(2, "0")}</span>
                    <span class="pill accent">${project.year || "Current"}</span>
                    <span class="pill">${project.category || "Project"}</span>
                  </div>
                  <h3 class="home-card-title">${project.title || "Untitled"}</h3>
                  <p class="home-card-text">${shortText}</p>
                </div>
              </button>
            `;
          })
          .join("");

        gridEl.querySelectorAll(".home-card").forEach((button) => {
          button.addEventListener("click", () =>
            openProject(button.dataset.projectId),
          );
        });
      }

      function openProject(projectId) {
        const p = homeProjectCache[projectId];
        if (!p) return;

        const modal = document.getElementById("project-modal");
        const content = modal.querySelector(".modal-content");
        const type = p.type || "video";

        let mediaHtml = "";
        if (type === "video") {
          const youtubeId = youtubeIdFromProject(p);
          mediaHtml = `
            <div class="modal-media-video panel">
              <iframe src="https://www.youtube.com/embed/${youtubeId}?autoplay=1&rel=0"
                      allow="autoplay; encrypted-media; fullscreen"
                      allowfullscreen></iframe>
            </div>
          `;
        } else if (type === "images") {
          mediaHtml = `
            <div class="modal-media-images panel">
              ${(p.images || []).map((img) => `<img src="${normalizeFlipbookPath(img)}" alt="${p.title}">`).join("")}
            </div>
          `;
        } else if (type === "flipbook-pdf" || type === "flipbook-images") {
          const flipbookId = "flipbook-" + p.id;
          mediaHtml = `
            <div class="modal-media-flipbook panel">
              <div id="${flipbookId}"></div>
              <div class="home-flipbook-controls">
                <button type="button" onclick="flipPrev('${flipbookId}')">Previous</button>
                <button type="button" onclick="flipNext('${flipbookId}')">Next</button>
                <button type="button" onclick="flipZoom('${flipbookId}')">Zoom</button>
              </div>
              <div id="${flipbookId}-info" class="home-flipbook-page-info">Loading...</div>
            </div>
          `;
        }

        content.innerHTML = `
          <header class="modal-header">
            <span class="modal-meta">${p.year || "Current"} · ${p.category || "Project"}</span>
            <h2 class="modal-title">${p.title || "Untitled"}</h2>
            ${p.description ? `<p class="modal-description">${p.description}</p>` : ""}
            ${p.credit ? `<span class="modal-credit">Credit · ${p.credit}</span>` : ""}
          </header>
          ${mediaHtml}
        `;

        modal.classList.add("is-open");
        document.body.classList.add("modal-open");

        if (type === "flipbook-pdf") {
          setTimeout(() => initHomeFlipbook(p.id, p.flipbookPdf), 60);
        } else if (type === "flipbook-images") {
          setTimeout(
            () => initHomeFlipbookImages(p.id, p.flipbookImages || {}),
            60,
          );
        }
      }

      function closeProject() {
        const modal = document.getElementById("project-modal");
        modal.classList.remove("is-open");
        document.body.classList.remove("modal-open");
        setTimeout(() => {
          modal.querySelector(".modal-content").innerHTML = "";
          Object.keys(homeViewers).forEach((k) => delete homeViewers[k]);
        }, 260);
      }

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeProject();
        }
      });

      function initHomeFlipbook(projectId, pdfPath) {
        const flipbookId = "flipbook-" + projectId;
        const flipViewerEl = document.getElementById(flipbookId);
        const pageInfo = document.getElementById(flipbookId + "-info");
        if (!flipViewerEl || !pageInfo || !pdfPath) return;

        pageInfo.textContent = "Loading PDF...";

        const cache = [];

        function renderPage(pdf, n, cb) {
          pdf
            .getPage(n)
            .then((page) => {
              const viewport = page.getViewport({ scale: 1.0 });
              const canvas = document.createElement("canvas");
              canvas.width = viewport.width;
              canvas.height = viewport.height;
              const context = canvas.getContext("2d");

              page
                .render({
                  canvasContext: context,
                  viewport,
                })
                .promise.then(() => {
                  const img = new Image();
                  img.onload = () => {
                    cache[n] = {
                      img,
                      num: n,
                      width: img.width,
                      height: img.height,
                    };
                    cb(null, cache[n]);
                  };
                  img.onerror = () => cb(new Error("Image conversion failed"));
                  img.src = canvas.toDataURL("image/jpeg", 0.85);
                })
                .catch(cb);
            })
            .catch(cb);
        }

        pdfjsLib
          .getDocument(pdfPath)
          .promise.then((pdf) => {
            const book = {
              pdf,
              numPages: () => pdf.numPages,
              getPage: (n, cb) => {
                if (!n || n > pdf.numPages) return cb();
                if (cache[n]) return cb(null, cache[n]);
                renderPage(pdf, n, cb);
              },
            };

            const viewportW = window.innerWidth || 1200;
            const viewportH = window.innerHeight || 800;
            const availableW = Math.max(360, Math.min(1420, viewportW - 80));
            const availableH = Math.max(420, viewportH - 240);
            const widthFromH = Math.floor(availableH / 0.95);
            const width = Math.min(availableW, widthFromH);
            const height = Math.floor(width * 0.95);

            renderPage(pdf, 1, () => {
              renderPage(pdf, Math.min(2, pdf.numPages), () => {
                flipbook.init(
                  book,
                  flipViewerEl,
                  {
                    width,
                    height,
                    backgroundColor: "#000000",
                    boxColor: "#000000",
                    boxBorder: 0,
                  },
                  (err, viewer) => {
                    if (err) {
                      console.error(err);
                      pageInfo.textContent = "Error loading PDF";
                      return;
                    }

                    homeViewers[flipbookId] = viewer;
                    pageInfo.textContent = `Page 1 of ${pdf.numPages}`;
                    viewer.on("seen", (n) => {
                      pageInfo.textContent = `Page ${n} of ${pdf.numPages}`;
                    });
                  },
                );
              });
            });
          })
          .catch((err) => {
            console.error("Failed to load PDF:", err);
            pageInfo.textContent = "Failed to load PDF";
          });
      }

      function initHomeFlipbookImages(projectId, config) {
        const flipbookId = "flipbook-" + projectId;
        const flipViewerEl = document.getElementById(flipbookId);
        const pageInfo = document.getElementById(flipbookId + "-info");
        if (!flipViewerEl || !pageInfo) return;

        const selectedPages = Array.isArray(config.pages)
          ? config.pages.filter((p) => typeof p === "string" && p.trim())
          : [];
        const useSelectedPages = selectedPages.length > 0;

        const rawBasePath =
          config.basePath || "pages_code/Handbook_Files/handbook-pages/page-";
        const extension = config.extension || ".png";
        const fallbackCount = parseInt(config.pageCount, 10) || 1;
        const sourceTotalPages = useSelectedPages
          ? selectedPages.length
          : fallbackCount;

        const shouldSkipFirstPage = config.skipFirstPage === true;
        const sourceStartIndex =
          shouldSkipFirstPage && sourceTotalPages > 1 ? 1 : 0;
        const contentTotalPages = Math.max(
          1,
          sourceTotalPages - sourceStartIndex,
        );
        const virtualTotalPages = contentTotalPages + 2;

        const cache = [];
        const basePath = normalizeFlipbookPath(rawBasePath);

        function getImageSrc(pageNum) {
          if (useSelectedPages) {
            return normalizeFlipbookPath(
              selectedPages[sourceStartIndex + pageNum - 1],
            );
          }
          const filePageNum = sourceStartIndex + pageNum;
          const paddedNum = String(filePageNum).padStart(2, "0");
          return `${basePath}${paddedNum}${extension}`;
        }

        function mapDisplayToSourcePage(displayPageNum) {
          return sourceStartIndex + displayPageNum;
        }

        function mapVirtualToContentPage(virtualPageNum) {
          if (virtualPageNum <= 0) return null;
          if (virtualPageNum >= virtualTotalPages - 1) return null;
          return virtualPageNum;
        }

        function loadImagePage(n, cb) {
          if (!n || n > contentTotalPages) return cb();
          if (cache[n]) return cb(null, cache[n]);

          const img = new Image();
          img.onload = () => {
            cache[n] = {
              img,
              num: n,
              width: img.width,
              height: img.height,
            };
            cb(null, cache[n]);
          };
          img.onerror = () => cb(new Error(`Failed to load page ${n}`));
          img.src = getImageSrc(n);
        }

        const book = {
          numPages: () => virtualTotalPages,
          getPage: (n, cb) => {
            if (n < 0 || n >= virtualTotalPages) return cb();
            const contentPage = mapVirtualToContentPage(n);
            if (!contentPage) return cb();
            loadImagePage(contentPage, cb);
          },
        };

        const viewportW = window.innerWidth || 1200;
        const viewportH = window.innerHeight || 800;
        const availableW = Math.max(360, Math.min(1420, viewportW - 80));
        const availableH = Math.max(380, viewportH - 340);
        const widthFromH = Math.floor(availableH / 0.72);
        const width = Math.min(availableW, widthFromH);
        const height = Math.floor(width * 0.72);

        pageInfo.textContent = "Loading images...";

        const secondPage = contentTotalPages > 1 ? 2 : 1;
        loadImagePage(1, (err) => {
          if (err) {
            console.error(err);
            pageInfo.textContent = "Failed to load images";
            return;
          }

          loadImagePage(secondPage, () => {
            flipbook.init(
              book,
              flipViewerEl,
              {
                width,
                height,
                backgroundColor: "#000000",
                boxColor: "#000000",
                boxBorder: 0,
              },
              (initErr, viewer) => {
                if (initErr) {
                  console.error(initErr);
                  pageInfo.textContent = "Error loading flipbook";
                  return;
                }

                homeViewers[flipbookId] = viewer;
                pageInfo.textContent = `Page ${mapDisplayToSourcePage(1)} of ${sourceTotalPages}`;

                viewer.on("seen", (n) => {
                  const contentPage = mapVirtualToContentPage(n);
                  if (!contentPage) return;
                  pageInfo.textContent = `Page ${mapDisplayToSourcePage(contentPage)} of ${sourceTotalPages}`;

                  for (let i = 1; i <= 3; i++) {
                    const nextContentPage = contentPage + i;
                    if (
                      nextContentPage <= contentTotalPages &&
                      !cache[nextContentPage]
                    ) {
                      loadImagePage(nextContentPage, () => {});
                    }
                  }
                });
              },
            );
          });
        });
      }

      function flipPrev(flipbookId) {
        if (homeViewers[flipbookId]) {
          homeViewers[flipbookId].flip_back();
        }
      }

      function flipNext(flipbookId) {
        if (homeViewers[flipbookId]) {
          homeViewers[flipbookId].flip_forward();
        }
      }

      function flipZoom(flipbookId) {
        if (
          homeViewers[flipbookId] &&
          typeof homeViewers[flipbookId].zoom === "function"
        ) {
          homeViewers[flipbookId].zoom();
        }
      }

      renderHomePage();
    </script>
  </body>
</html>
