<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects - Charlie Cilla</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        --bg: #ffffff;
        --text: #0d0d0d;
        --muted: #3a3a3a;
        --faint: #8a8a84;
        --line: #dadada;
        --link-blue: #1237c4;
        --link-purple: #63239e;
        --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
        --serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--serif);
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: var(--link-blue);
      }

      img {
        display: block;
        max-width: 100%;
        height: auto;
      }

      .page {
        width: 100%;
        margin: 0;
        padding: 36px clamp(24px, 4vw, 64px) 70px;
        position: relative;
      }

      .top-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 6px;
        font-family: var(--mono);
        font-size: 0.78rem;
      }

      .top-row a {
        color: var(--text);
        text-decoration: none;
      }

      .top-row a:hover {
        color: var(--link-blue);
      }

      .corner-label {
        font-size: 0.8rem;
        font-style: italic;
        color: var(--muted);
        text-align: right;
      }

      .page-title {
        font-size: 2.4rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 34px 0 44px;
      }

      .list {
        max-width: 640px;
      }

      .entry {
        display: block;
        width: 100%;
        border: none;
        background: none;
        padding: 0;
        text-align: left;
        font-family: inherit;
        cursor: pointer;
        margin-bottom: 26px;
      }

      .entry .idx-title {
        font-weight: 600;
        font-size: 1rem;
      }

      .entry .idx-title a {
        color: var(--link-purple);
        text-decoration: underline;
        text-transform: lowercase;
      }

      .entry .idx-title a.blue {
        color: var(--link-blue);
      }

      .entry p {
        font-style: italic;
        font-size: 0.9rem;
        color: var(--muted);
        line-height: 1.55;
        margin: 4px 0 0;
        max-width: 56ch;
      }

      .page-footer {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 0.78rem;
      }

      .page-footer a {
        color: var(--text);
        text-decoration: none;
      }

      .page-footer a:hover {
        color: var(--link-blue);
      }

      /* ===== modal ===== */
      .modal {
        position: fixed;
        inset: 0;
        background: #fff;
        z-index: 500;
        overflow-y: auto;
        opacity: 0;
        visibility: hidden;
        transform: translateY(14px);
        transition:
          opacity 0.22s ease,
          transform 0.22s ease,
          visibility 0.22s;
      }

      .modal.is-open {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .modal-inner {
        max-width: 900px;
        margin: 0 auto;
        padding: 44px 32px 90px;
      }

      .modal-top {
        margin-bottom: 40px;
        font-family: var(--mono);
        font-size: 0.78rem;
      }

      .modal-top button {
        color: var(--text);
        text-decoration: none;
        background: none;
        border: none;
        font-family: var(--mono);
        font-size: 0.78rem;
        cursor: pointer;
        padding: 0;
      }

      .modal-top button:hover {
        color: var(--link-blue);
      }

      .modal h1 {
        font-size: 2.1rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 18px;
        line-height: 1.12;
        text-transform: lowercase;
      }

      .modal .desc {
        font-size: 1rem;
        line-height: 1.7;
        max-width: 60ch;
        margin: 0 0 30px;
        color: var(--muted);
      }

      .media-block {
        margin-bottom: 14px;
      }

      .media-video {
        position: relative;
        padding-bottom: 56.25%;
        height: 0;
        border: 1px solid var(--line);
        overflow: hidden;
      }

      .media-video iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .media-images img {
        width: 100%;
        display: block;
        border: 1px solid var(--line);
        margin-bottom: 10px;
      }

      .media-fan {
        display: flex;
        overflow-x: auto;
        padding: 10px 0 20px;
      }

      .media-fan img {
        width: 220px;
        flex: 0 0 auto;
        aspect-ratio: 1 / 1.45;
        object-fit: cover;
        border: 1px solid var(--line);
        margin-left: -70px;
        background: #fff;
        transition: transform 0.2s ease;
      }

      .media-fan img:first-child {
        margin-left: 0;
      }

      .media-fan img:hover {
        transform: translateY(-10px);
        z-index: 2;
      }

      .media-flipbook {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--line);
        padding: 20px;
      }

      .flipbook-controls {
        display: flex;
        gap: 18px;
        font-family: var(--mono);
        font-size: 0.78rem;
      }

      .flipbook-controls button {
        color: var(--link-blue);
        background: none;
        border: none;
        font-family: var(--mono);
        font-size: 0.78rem;
        cursor: pointer;
        padding: 0;
      }

      .flipbook-info {
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--faint);
      }

      .modal-footer {
        margin-top: 50px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        font-family: var(--mono);
        font-size: 0.78rem;
      }

      .modal-footer button {
        color: var(--text);
        background: none;
        border: none;
        font-family: var(--mono);
        font-size: 0.78rem;
        cursor: pointer;
        padding: 0;
        text-transform: lowercase;
      }

      .modal-footer button:hover {
        color: var(--link-blue);
      }

      body.modal-open {
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="top-row">
        <a href="../index.html">&larr; home</a>
        <span class="corner-label">charlie cilla<br />design + film</span>
      </div>

      <h1 class="page-title">Projects</h1>

      <div class="list" id="project-list"></div>

      <div class="page-footer">
        <a href="../index.html">&larr; back to selected works</a>
      </div>
    </div>

    <div id="project-modal" class="modal">
      <div class="modal-inner">
        <div class="modal-top">
          <button type="button" onclick="closeProjectModal()">&larr; back to projects</button>
        </div>
        <div id="modal-content"></div>
      </div>
    </div>

    <link rel="stylesheet" href="../admin/admin.css" />
    <script src="../admin/data.js"></script>
    <script src="../admin/admin.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="Handbook_Files/flipbook-viewer-master/dist/flipbook-viewer.js"></script>
    <script>
      const projectsById = {};
      let currentProjectViewer = null;

      function stripHtml(input) {
        return (input || "").replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
      }

      function youtubeIdFromUrl(url) {
        if (!url) return "";
        const match = String(url).match(
          /(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{6,})/,
        );
        return match ? match[1] : "";
      }

      function normalizeProjectAssetPath(path) {
        if (!path) return "";
        if (/^(https?:|data:|blob:)/i.test(path)) return path;
        return path;
      }

      // Fallback in case cached project data (e.g. from an earlier admin
      // edit stored in localStorage) predates the flipbookImages field.
      function isVoicesProject(project) {
        const title = String(project.title || "").toLowerCase();
        return title.includes("voices") || project.id === "project-5";
      }

      function getEffectiveFlipbookImages(project) {
        if (project.flipbookImages) return project.flipbookImages;
        if (isVoicesProject(project)) {
          return {
            basePath: "Handbook_Files/handbook-pages/voices-",
            pageCount: 36,
            extension: ".png",
          };
        }
        return null;
      }

      function getProjectsData() {
        return AdminData.getProjects().filter((p) => p.visible !== false);
      }

      function projectOrder() {
        return Object.values(projectsById);
      }

      function renderProjectsPage() {
        const projects = getProjectsData();
        const listEl = document.getElementById("project-list");

        projects.forEach((project) => {
          projectsById[project.id] = project;
        });

        if (!projects.length) {
          listEl.innerHTML = '<p>No projects available right now.</p>';
          return;
        }

        listEl.innerHTML = projects
          .map((project, idx) => {
            const idxLabel = String(idx + 1).padStart(2, "0");
            const excerpt = stripHtml(project.description).slice(0, 150);
            const readableExcerpt = excerpt
              ? `${excerpt}${excerpt.length >= 150 ? "..." : ""}`
              : "Project details coming soon.";
            const linkClass = idx % 2 === 0 ? "" : "blue";

            return `
              <button type="button" class="entry" data-project-id="${project.id}">
                <div class="idx-title">${idxLabel}. <a class="${linkClass}">${project.title || "Untitled"}</a></div>
                <p>${readableExcerpt}</p>
              </button>
            `;
          })
          .join("");

        listEl.querySelectorAll(".entry").forEach((button) => {
          button.addEventListener("click", () =>
            openProjectModal(button.dataset.projectId),
          );
        });
      }

      function openProjectModal(projectId) {
        const project = projectsById[projectId];
        if (!project) return;

        const modal = document.getElementById("project-modal");
        const content = document.getElementById("modal-content");

        let mediaHtml = "";

        if (project.type === "video") {
          const id =
            youtubeIdFromUrl(project.youtubeUrl || project.youtube || "") ||
            project.youtubeId ||
            "";
          if (id) {
            mediaHtml = `
              <div class="media-block media-video">
                <iframe src="https://www.youtube.com/embed/${id}?rel=0"
                        allow="autoplay; encrypted-media; fullscreen"
                        allowfullscreen></iframe>
              </div>
            `;
          }
        } else if (getEffectiveFlipbookImages(project)) {
          const flipbookId = "flipbook-" + project.id;
          mediaHtml = `
            <div class="media-block media-flipbook">
              <div id="${flipbookId}"></div>
              <div class="flipbook-controls">
                <button type="button" onclick="flipbookPrev()">&larr; prev</button>
                <button type="button" onclick="flipbookNext()">next &rarr;</button>
                <button type="button" onclick="flipbookZoom()">zoom</button>
              </div>
              <div id="${flipbookId}-info" class="flipbook-info">Loading...</div>
            </div>
          `;
        } else if (Array.isArray(project.images) && project.images.length > 0) {
          const isFan = project.displayStyle === "grid-5";
          const imgs = project.images
            .map((src) => `<img src="${src}" alt="${project.title || "Project image"}" loading="lazy" />`)
            .join("");
          mediaHtml = `
            <div class="media-block ${isFan ? "media-fan" : "media-images"}">${imgs}</div>
          `;
        }

        const order = projectOrder();
        const currentIdx = order.findIndex((p) => p.id === projectId);
        const prevProject = order[(currentIdx - 1 + order.length) % order.length];
        const nextProject = order[(currentIdx + 1) % order.length];

        content.innerHTML = `
          <h1>${project.title || "Untitled"}</h1>
          <p class="desc">${project.description || "Project details coming soon."}</p>
          ${mediaHtml}
          <div class="modal-footer">
            <button type="button" onclick="openProjectModal('${prevProject.id}')">&larr; ${prevProject.title.toLowerCase()}</button>
            <button type="button" onclick="openProjectModal('${nextProject.id}')">${nextProject.title.toLowerCase()} &rarr;</button>
          </div>
        `;

        modal.classList.add("is-open");
        document.body.classList.add("modal-open");

        const effectiveFlipbook = getEffectiveFlipbookImages(project);
        if (effectiveFlipbook) {
          setTimeout(() => initProjectFlipbook(project.id, effectiveFlipbook), 60);
        }
      }

      function closeProjectModal() {
        const modal = document.getElementById("project-modal");
        modal.classList.remove("is-open");
        document.body.classList.remove("modal-open");
        currentProjectViewer = null;
        setTimeout(() => {
          document.getElementById("modal-content").innerHTML = "";
        }, 260);
      }

      function initProjectFlipbook(projectId, config) {
        const flipbookId = "flipbook-" + projectId;
        const root = document.getElementById(flipbookId);
        const info = document.getElementById(flipbookId + "-info");
        if (!root || !info || typeof flipbook === "undefined") {
          if (info) info.textContent = "Flipbook viewer is unavailable.";
          return;
        }

        const basePath = normalizeProjectAssetPath(
          config.basePath || "Handbook_Files/handbook-pages/page-",
        );
        const extension = config.extension || ".png";
        const totalPages = Math.max(1, parseInt(config.pageCount, 10) || 1);
        const cache = [];

        function getSrc(pageNum) {
          const padded = String(pageNum).padStart(2, "0");
          return `${basePath}${padded}${extension}`;
        }

        function loadPage(n, cb) {
          if (!n || n > totalPages) return cb();
          if (cache[n]) return cb(null, cache[n]);

          const img = new Image();
          img.onload = () => {
            cache[n] = { img, num: n, width: img.width, height: img.height };
            cb(null, cache[n]);
          };
          img.onerror = () => cb(new Error(`Failed to load page ${n}`));
          img.src = getSrc(n);
        }

        const book = {
          numPages: () => totalPages,
          getPage: (n, cb) => {
            if (!n || n > totalPages) return cb();
            loadPage(n, cb);
          },
        };

        info.textContent = "Loading flipbook...";
        loadPage(1, (err) => {
          if (err) {
            info.textContent = "Failed to load flipbook pages.";
            return;
          }

          const viewportW = window.innerWidth || 1200;
          const viewportH = window.innerHeight || 800;
          const availableW = Math.max(360, Math.min(1420, viewportW - 80));
          const availableH = Math.max(380, viewportH - 320);
          const widthFromH = Math.floor(availableH / 0.72);
          const width = Math.min(availableW, widthFromH);
          const height = Math.floor(width * 0.72);

          flipbook.init(
            book,
            root,
            {
              width,
              height,
              backgroundColor: "#ffffff",
              boxColor: "#ffffff",
              boxBorder: 0,
            },
            (initErr, viewer) => {
              if (initErr) {
                console.error(initErr);
                info.textContent = "Failed to initialize flipbook.";
                return;
              }

              currentProjectViewer = viewer;
              info.textContent = `Page 1 of ${totalPages}`;

              viewer.on("seen", (n) => {
                info.textContent = `Page ${n} of ${totalPages}`;
              });
            },
          );
        });
      }

      function flipbookPrev() {
        if (currentProjectViewer) currentProjectViewer.flip_back();
      }

      function flipbookNext() {
        if (currentProjectViewer) currentProjectViewer.flip_forward();
      }

      function flipbookZoom() {
        if (currentProjectViewer && typeof currentProjectViewer.zoom === "function") {
          currentProjectViewer.zoom();
        }
      }

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeProjectModal();
        }
      });

      renderProjectsPage();
    </script>
  </body>
</html>
