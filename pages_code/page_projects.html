<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects - Charlie Cilla</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        --bg: #ffffff;
        --text: #0d0d0d;
        --muted: #3a3a3a;
        --faint: #8a8a84;
        --line: #dadada;
        --link-blue: #1237c4;
        --link-purple: #63239e;
        --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
        --serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--serif);
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: var(--link-blue);
      }

      img {
        display: block;
        max-width: 100%;
        height: auto;
      }

      .page {
        width: 100%;
        margin: 0;
        padding: 36px clamp(24px, 4vw, 64px) 70px;
        position: relative;
      }

      .top-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 6px;
        font-family: var(--mono);
        font-size: 0.78rem;
      }

      .top-row a {
        color: var(--text);
        text-decoration: none;
      }

      .top-row a:hover {
        color: var(--link-blue);
      }

      .corner-label {
        font-size: 0.8rem;
        font-style: italic;
        color: var(--muted);
        text-align: right;
      }

      .page-title {
        font-size: 2.4rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 34px 0 44px;
      }

      .list {
        max-width: 640px;
      }

      .entry {
        display: block;
        width: 100%;
        border: none;
        background: none;
        padding: 0;
        text-align: left;
        font-family: inherit;
        cursor: pointer;
        margin-bottom: 26px;
      }

      .entry .idx-title {
        font-weight: 600;
        font-size: 1rem;
      }

      .entry .idx-title a {
        color: var(--link-purple);
        text-decoration: underline;
        text-transform: lowercase;
      }

      .entry .idx-title a.blue {
        color: var(--link-blue);
      }

      .entry p {
        font-style: italic;
        font-size: 0.9rem;
        color: var(--muted);
        line-height: 1.55;
        margin: 4px 0 0;
        max-width: 56ch;
      }

      .page-footer {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 0.78rem;
      }

      .page-footer a {
        color: var(--text);
        text-decoration: none;
      }

      .page-footer a:hover {
        color: var(--link-blue);
      }

      /* ===== modal ===== */
      .modal {
        position: fixed;
        inset: 0;
        background: #fff;
        z-index: 500;
        overflow-y: auto;
        opacity: 0;
        visibility: hidden;
        transform: translateY(14px);
        transition:
          opacity 0.22s ease,
          transform 0.22s ease,
          visibility 0.22s;
      }

      .modal.is-open {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .modal-inner {
        max-width: 1320px;
        margin: 0 auto;
        padding: 44px 32px 90px;
      }

      .modal-grid {
        display: grid;
        grid-template-columns: minmax(260px, 400px) 1fr;
        gap: 48px;
        align-items: start;
      }

      .modal-text {
        min-width: 0;
      }

      .modal-media {
        min-width: 0;
      }

      @media (max-width: 900px) {
        .modal-grid {
          grid-template-columns: 1fr;
          gap: 28px;
        }
      }

      .modal-top {
        margin-bottom: 40px;
        font-family: var(--mono);
        font-size: 0.78rem;
      }

      .modal-top button {
        color: var(--text);
        text-decoration: none;
        background: none;
        border: none;
        font-family: var(--mono);
        font-size: 0.78rem;
        cursor: pointer;
        padding: 0;
      }

      .modal-top button:hover {
        color: var(--link-blue);
      }

      .modal h1 {
        font-size: 2.1rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 18px;
        line-height: 1.12;
        text-transform: lowercase;
      }

      .modal .desc {
        font-size: 1rem;
        line-height: 1.7;
        max-width: 60ch;
        margin: 0 0 30px;
        color: var(--muted);
      }

      .media-block {
        margin-bottom: 14px;
      }

      .media-video {
        position: relative;
        padding-bottom: 56.25%;
        height: 0;
        border: 1px solid var(--line);
        overflow: hidden;
      }

      .media-video iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .media-images img {
        width: 100%;
        display: block;
        border: 1px solid var(--line);
        margin-bottom: 10px;
      }

      .media-fan {
        display: flex;
        overflow-x: auto;
        padding: 10px 0 20px;
      }

      .media-fan img {
        width: 220px;
        flex: 0 0 auto;
        aspect-ratio: 1 / 1.45;
        object-fit: cover;
        border: 1px solid var(--line);
        margin-left: -70px;
        background: #fff;
        transition: transform 0.2s ease;
      }

      .media-fan img:first-child {
        margin-left: 0;
      }

      .media-fan img:hover {
        transform: translateY(-10px);
        z-index: 2;
      }

      .media-carousel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        width: 100%;
      }

      .carousel-viewport {
        position: relative;
        width: 100%;
      }

      .carousel-track {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        background: #fff;
      }

      .carousel-track::-webkit-scrollbar {
        display: none;
      }

      .carousel-slide {
        flex: 0 0 100%;
        scroll-snap-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .carousel-slide img {
        flex: none;
        width: auto;
        height: auto;
        max-height: 80vh;
        display: block;
      }

      .carousel-slide.single img {
        max-width: 100%;
      }

      .carousel-slide.spread img {
        max-width: 50%;
      }

      .carousel-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 36px;
        height: 36px;
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 0.9rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .carousel-nav:hover {
        color: var(--link-blue);
      }

      .carousel-prev {
        left: 10px;
      }

      .carousel-next {
        right: 10px;
      }

      .carousel-footer {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .carousel-zoom {
        color: var(--link-blue);
        background: none;
        border: none;
        font-family: var(--mono);
        font-size: 0.78rem;
        cursor: pointer;
        padding: 0;
      }

      .carousel-lightbox {
        position: fixed;
        inset: 0;
        z-index: 900;
        background: rgba(0, 0, 0, 0.92);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.18s ease,
          visibility 0.18s;
      }

      .carousel-lightbox.is-open {
        opacity: 1;
        visibility: visible;
      }

      .carousel-lightbox-track {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        width: 92vw;
        height: 92vh;
      }

      .carousel-lightbox-track::-webkit-scrollbar {
        display: none;
      }

      .carousel-lightbox-track .carousel-slide img {
        max-height: 92vh;
      }

      .carousel-lightbox-track .carousel-slide.single img {
        max-width: 100%;
      }

      .carousel-lightbox-track .carousel-slide.spread img {
        max-width: 50%;
      }

      .carousel-lightbox-prev {
        left: 24px;
      }

      .carousel-lightbox-next {
        right: 24px;
      }

      .carousel-lightbox-close {
        position: absolute;
        top: 24px;
        right: 28px;
        background: none;
        border: none;
        color: #fff;
        font-family: var(--mono);
        font-size: 0.9rem;
        cursor: pointer;
        padding: 0;
        z-index: 1;
      }

      .carousel-lightbox-close:hover {
        color: var(--link-blue);
      }

      .media-flipbook {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .flipbook-controls {
        display: flex;
        gap: 18px;
        font-family: var(--mono);
        font-size: 0.78rem;
      }

      .flipbook-controls button {
        color: var(--link-blue);
        background: none;
        border: none;
        font-family: var(--mono);
        font-size: 0.78rem;
        cursor: pointer;
        padding: 0;
      }

      .flipbook-info {
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--faint);
      }

      .modal-footer {
        margin-top: 50px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        font-family: var(--mono);
        font-size: 0.78rem;
      }

      .modal-footer button {
        color: var(--text);
        background: none;
        border: none;
        font-family: var(--mono);
        font-size: 0.78rem;
        cursor: pointer;
        padding: 0;
        text-transform: lowercase;
      }

      .modal-footer button:hover {
        color: var(--link-blue);
      }

      body.modal-open {
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="top-row">
        <a href="../index.html">&larr; home</a>
        <span class="corner-label">charlie cilla<br />design + film</span>
      </div>

      <h1 class="page-title">Projects</h1>

      <div class="list" id="project-list"></div>

      <div class="page-footer">
        <a href="../index.html">&larr; back to selected works</a>
      </div>
    </div>

    <div id="project-modal" class="modal">
      <div class="modal-inner">
        <div class="modal-top">
          <button type="button" onclick="closeProjectModal()">&larr; back to projects</button>
        </div>
        <div id="modal-content"></div>
      </div>
    </div>

    <div id="carousel-lightbox" class="carousel-lightbox">
      <button type="button" class="carousel-lightbox-close" onclick="closeCarouselZoom()">&times; close</button>
      <button type="button" class="carousel-nav carousel-lightbox-prev" onclick="lightboxPrev()" aria-label="Previous slide">&larr;</button>
      <div id="carousel-lightbox-track" class="carousel-lightbox-track"></div>
      <button type="button" class="carousel-nav carousel-lightbox-next" onclick="lightboxNext()" aria-label="Next slide">&rarr;</button>
    </div>

    <link rel="stylesheet" href="../admin/admin.css" />
    <script src="../admin/data.js"></script>
    <script src="../admin/admin.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="Handbook_Files/flipbook-viewer-master/dist/flipbook-viewer.js"></script>
    <script>
      const projectsById = {};
      let currentProjectViewer = null;
      const projectCarousels = {};
      let activeZoomCarouselId = null;

      function stripHtml(input) {
        return (input || "").replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
      }

      function youtubeIdFromUrl(url) {
        if (!url) return "";
        const match = String(url).match(
          /(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{6,})/,
        );
        return match ? match[1] : "";
      }

      function normalizeProjectAssetPath(path) {
        if (!path) return "";
        if (/^(https?:|data:|blob:)/i.test(path)) return path;
        return path;
      }

      // Fallback in case cached project data (e.g. from an earlier admin
      // edit stored in localStorage) predates the flipbookImages field.
      function isVoicesProject(project) {
        const title = String(project.title || "").toLowerCase();
        return title.includes("voices") || project.id === "project-5";
      }

      function getEffectiveCarouselImages(project) {
        if (project.carouselImages) return project.carouselImages;
        if (project.flipbookImages) return project.flipbookImages;
        if (isVoicesProject(project)) {
          return {
            basePath: "Handbook_Files/handbook-pages/voices-",
            pageCount: 36,
            extension: ".png",
          };
        }
        return null;
      }

      function getProjectsData() {
        return AdminData.getProjects().filter((p) => p.visible !== false);
      }

      function projectOrder() {
        return Object.values(projectsById);
      }

      function renderProjectsPage() {
        const projects = getProjectsData();
        const listEl = document.getElementById("project-list");

        projects.forEach((project) => {
          projectsById[project.id] = project;
        });

        if (!projects.length) {
          listEl.innerHTML = '<p>No projects available right now.</p>';
          return;
        }

        listEl.innerHTML = projects
          .map((project, idx) => {
            const idxLabel = String(idx + 1).padStart(2, "0");
            const excerpt = stripHtml(project.description).slice(0, 150);
            const readableExcerpt = excerpt
              ? `${excerpt}${excerpt.length >= 150 ? "..." : ""}`
              : "Project details coming soon.";
            const linkClass = idx % 2 === 0 ? "" : "blue";

            return `
              <button type="button" class="entry" data-project-id="${project.id}">
                <div class="idx-title">${idxLabel}. <a class="${linkClass}">${project.title || "Untitled"}</a></div>
                <p>${readableExcerpt}</p>
              </button>
            `;
          })
          .join("");

        listEl.querySelectorAll(".entry").forEach((button) => {
          button.addEventListener("click", () =>
            openProjectModal(button.dataset.projectId),
          );
        });
      }

      function openProjectModal(projectId) {
        const project = projectsById[projectId];
        if (!project) return;

        const modal = document.getElementById("project-modal");
        const content = document.getElementById("modal-content");

        let mediaHtml = "";

        if (project.type === "video") {
          const id =
            youtubeIdFromUrl(project.youtubeUrl || project.youtube || "") ||
            project.youtubeId ||
            "";
          if (id) {
            mediaHtml = `
              <div class="media-block media-video">
                <iframe src="https://www.youtube.com/embed/${id}?rel=0"
                        allow="autoplay; encrypted-media; fullscreen"
                        allowfullscreen></iframe>
              </div>
            `;
          }
        } else if (getEffectiveCarouselImages(project)) {
          const carouselId = "carousel-" + project.id;
          mediaHtml = `
            <div class="media-block media-carousel">
              <div class="carousel-viewport">
                <div id="${carouselId}" class="carousel-track"></div>
                <button type="button" class="carousel-nav carousel-prev" onclick="carouselPrev('${carouselId}')" aria-label="Previous slide">&larr;</button>
                <button type="button" class="carousel-nav carousel-next" onclick="carouselNext('${carouselId}')" aria-label="Next slide">&rarr;</button>
              </div>
              <div class="carousel-footer">
                <div id="${carouselId}-info" class="flipbook-info">Loading...</div>
                <button type="button" class="carousel-zoom" onclick="carouselZoom('${carouselId}')">zoom</button>
              </div>
            </div>
          `;
        } else if (Array.isArray(project.images) && project.images.length > 0) {
          const isFan = project.displayStyle === "grid-5";
          const imgs = project.images
            .map((src) => `<img src="${src}" alt="${project.title || "Project image"}" loading="lazy" />`)
            .join("");
          mediaHtml = `
            <div class="media-block ${isFan ? "media-fan" : "media-images"}">${imgs}</div>
          `;
        }

        const order = projectOrder();
        const currentIdx = order.findIndex((p) => p.id === projectId);
        const prevProject = order[(currentIdx - 1 + order.length) % order.length];
        const nextProject = order[(currentIdx + 1) % order.length];

        content.innerHTML = `
          <div class="modal-grid">
            <div class="modal-text">
              <h1>${project.title || "Untitled"}</h1>
              <p class="desc">${project.description || "Project details coming soon."}</p>
            </div>
            <div class="modal-media" id="modal-media">${mediaHtml}</div>
          </div>
          <div class="modal-footer">
            <button type="button" onclick="openProjectModal('${prevProject.id}')">&larr; ${prevProject.title.toLowerCase()}</button>
            <button type="button" onclick="openProjectModal('${nextProject.id}')">${nextProject.title.toLowerCase()} &rarr;</button>
          </div>
        `;

        modal.classList.add("is-open");
        document.body.classList.add("modal-open");

        const effectiveCarousel = getEffectiveCarouselImages(project);
        if (effectiveCarousel) {
          setTimeout(() => initProjectCarousel(project.id, effectiveCarousel), 60);
        }
      }

      function closeProjectModal() {
        const modal = document.getElementById("project-modal");
        modal.classList.remove("is-open");
        document.body.classList.remove("modal-open");
        closeCarouselZoom();
        currentProjectViewer = null;
        setTimeout(() => {
          document.getElementById("modal-content").innerHTML = "";
          Object.keys(projectCarousels).forEach((k) => delete projectCarousels[k]);
        }, 260);
      }

      function initProjectFlipbook(projectId, config) {
        const flipbookId = "flipbook-" + projectId;
        const root = document.getElementById(flipbookId);
        const info = document.getElementById(flipbookId + "-info");
        if (!root || !info || typeof flipbook === "undefined") {
          if (info) info.textContent = "Flipbook viewer is unavailable.";
          return;
        }

        const basePath = normalizeProjectAssetPath(
          config.basePath || "Handbook_Files/handbook-pages/page-",
        );
        const extension = config.extension || ".png";
        const totalPages = Math.max(1, parseInt(config.pageCount, 10) || 1);
        const cache = [];

        function getSrc(pageNum) {
          const padded = String(pageNum).padStart(2, "0");
          return `${basePath}${padded}${extension}`;
        }

        function loadPage(n, cb) {
          if (!n || n > totalPages) return cb();
          if (cache[n]) return cb(null, cache[n]);

          const img = new Image();
          img.onload = () => {
            cache[n] = { img, num: n, width: img.width, height: img.height };
            cb(null, cache[n]);
          };
          img.onerror = () => cb(new Error(`Failed to load page ${n}`));
          img.src = getSrc(n);
        }

        const book = {
          numPages: () => totalPages,
          getPage: (n, cb) => {
            if (!n || n > totalPages) return cb();
            loadPage(n, cb);
          },
        };

        info.textContent = "Loading flipbook...";
        loadPage(1, (err) => {
          if (err) {
            info.textContent = "Failed to load flipbook pages.";
            return;
          }

          const viewportW = window.innerWidth || 1200;
          const viewportH = window.innerHeight || 800;
          const containerEl = document.getElementById("modal-media");
          const containerW =
            (containerEl && containerEl.clientWidth) || viewportW - 80;
          const availableW = Math.max(360, Math.min(1420, containerW));
          const availableH = Math.max(380, viewportH - 260);
          const widthFromH = Math.floor(availableH / 0.72);
          const width = Math.min(availableW, widthFromH);
          const height = Math.floor(width * 0.72);

          flipbook.init(
            book,
            root,
            {
              width,
              height,
              backgroundColor: "#ffffff",
              boxColor: "#ffffff",
              boxBorder: 0,
            },
            (initErr, viewer) => {
              if (initErr) {
                console.error(initErr);
                info.textContent = "Failed to initialize flipbook.";
                return;
              }

              currentProjectViewer = viewer;
              info.textContent = `Page 1 of ${totalPages}`;

              viewer.on("seen", (n) => {
                info.textContent = `Page ${n} of ${totalPages}`;
              });
            },
          );
        });
      }

      function getCarouselPageUrls(config) {
        const basePath = normalizeProjectAssetPath(
          config.basePath || "Handbook_Files/handbook-pages/page-",
        );
        const extension = config.extension || ".png";
        const totalPages = Math.max(1, parseInt(config.pageCount, 10) || 1);
        const urls = [];
        for (let n = 1; n <= totalPages; n++) {
          urls.push(`${basePath}${String(n).padStart(2, "0")}${extension}`);
        }
        return urls;
      }

      // Groups flat page-image URLs into carousel slides. With useSpreads,
      // page 1 stands alone (cover) and the rest pair up two-at-a-time to
      // recreate an open-book spread, matching how the source PDFs were
      // split down the middle into single pages.
      function buildCarouselGroups(urls, useSpreads) {
        if (!useSpreads) {
          return urls.map((url, i) => ({ urls: [url], pages: [i + 1] }));
        }
        const groups = [];
        if (!urls.length) return groups;
        groups.push({ urls: [urls[0]], pages: [1] });
        for (let i = 1; i < urls.length; i += 2) {
          if (i + 1 < urls.length) {
            groups.push({ urls: [urls[i], urls[i + 1]], pages: [i + 1, i + 2] });
          } else {
            groups.push({ urls: [urls[i]], pages: [i + 1] });
          }
        }
        return groups;
      }

      function carouselGroupLabel(group, totalPages, useSpreads) {
        const label =
          group.pages.length === 2
            ? `Pages ${group.pages[0]}–${group.pages[1]}`
            : `Page ${group.pages[0]}`;
        return useSpreads
          ? `${label} of ${totalPages}`
          : `Slide ${group.pages[0]} of ${totalPages}`;
      }

      function initProjectCarousel(projectId, config) {
        const carouselId = "carousel-" + projectId;
        const track = document.getElementById(carouselId);
        const pageInfo = document.getElementById(carouselId + "-info");
        if (!track || !pageInfo) return;

        const urls = getCarouselPageUrls(config);
        if (!urls.length) {
          pageInfo.textContent = "No slides found";
          return;
        }

        const useSpreads = config.spread === true;
        const groups = buildCarouselGroups(urls, useSpreads);

        track.innerHTML = groups
          .map((group, i) => {
            const imgs = group.urls
              .map(
                (url, j) =>
                  `<img src="${url}" alt="Page ${group.pages[j]}" loading="${i === 0 ? "eager" : "lazy"}" decoding="async">`,
              )
              .join("");
            const sizeClass = group.urls.length === 2 ? "spread" : "single";
            return `<div class="carousel-slide ${sizeClass}">${imgs}</div>`;
          })
          .join("");

        const state = {
          track,
          groups,
          count: groups.length,
          current: 0,
          totalPages: urls.length,
          useSpreads,
        };
        projectCarousels[carouselId] = state;

        const update = (n) => {
          state.current = n;
          pageInfo.textContent = carouselGroupLabel(groups[n], urls.length, useSpreads);
        };
        state.setCurrent = update;
        update(0);

        let scrollTimer = null;
        track.addEventListener("scroll", () => {
          clearTimeout(scrollTimer);
          scrollTimer = setTimeout(() => {
            const slideW = track.clientWidth || 1;
            const idx = Math.round(track.scrollLeft / slideW);
            update(Math.max(0, Math.min(groups.length - 1, idx)));
          }, 80);
        });
      }

      function carouselGoTo(carouselId, index) {
        const state = projectCarousels[carouselId];
        if (!state) return;
        const clamped = Math.max(0, Math.min(state.count - 1, index));
        const slide = state.track.children[clamped];
        if (slide) {
          slide.scrollIntoView({
            behavior: "smooth",
            inline: "center",
            block: "nearest",
          });
        }
      }

      function carouselPrev(carouselId) {
        const state = projectCarousels[carouselId];
        if (!state) return;
        const slideW = state.track.clientWidth || 1;
        const idx = Math.round(state.track.scrollLeft / slideW) - 1;
        carouselGoTo(carouselId, idx);
      }

      function carouselNext(carouselId) {
        const state = projectCarousels[carouselId];
        if (!state) return;
        const slideW = state.track.clientWidth || 1;
        const idx = Math.round(state.track.scrollLeft / slideW) + 1;
        carouselGoTo(carouselId, idx);
      }

      function carouselZoom(carouselId) {
        const state = projectCarousels[carouselId];
        const lightbox = document.getElementById("carousel-lightbox");
        const track = document.getElementById("carousel-lightbox-track");
        if (!state || !lightbox || !track) return;

        activeZoomCarouselId = carouselId;

        track.innerHTML = state.groups
          .map((group) => {
            const imgs = group.urls
              .map(
                (url, j) =>
                  `<img src="${url}" alt="Page ${group.pages[j]}" loading="lazy" decoding="async">`,
              )
              .join("");
            const sizeClass = group.urls.length === 2 ? "spread" : "single";
            return `<div class="carousel-slide ${sizeClass}">${imgs}</div>`;
          })
          .join("");

        lightbox.classList.add("is-open");
        track.scrollLeft = state.current * (track.clientWidth || 1);
      }

      function closeCarouselZoom() {
        const lightbox = document.getElementById("carousel-lightbox");
        if (!lightbox) return;
        lightbox.classList.remove("is-open");
        if (activeZoomCarouselId) {
          const state = projectCarousels[activeZoomCarouselId];
          if (state) {
            state.track.scrollLeft = state.current * (state.track.clientWidth || 1);
          }
        }
        activeZoomCarouselId = null;
      }

      function lightboxGoTo(index) {
        if (!activeZoomCarouselId) return;
        const state = projectCarousels[activeZoomCarouselId];
        const track = document.getElementById("carousel-lightbox-track");
        if (!state || !track) return;
        const clamped = Math.max(0, Math.min(state.count - 1, index));
        const slide = track.children[clamped];
        if (slide) {
          slide.scrollIntoView({
            behavior: "smooth",
            inline: "center",
            block: "nearest",
          });
        }
      }

      function lightboxPrev() {
        const track = document.getElementById("carousel-lightbox-track");
        if (!track) return;
        const slideW = track.clientWidth || 1;
        lightboxGoTo(Math.round(track.scrollLeft / slideW) - 1);
      }

      function lightboxNext() {
        const track = document.getElementById("carousel-lightbox-track");
        if (!track) return;
        const slideW = track.clientWidth || 1;
        lightboxGoTo(Math.round(track.scrollLeft / slideW) + 1);
      }

      function flipbookPrev() {
        if (currentProjectViewer) currentProjectViewer.flip_back();
      }

      function flipbookNext() {
        if (currentProjectViewer) currentProjectViewer.flip_forward();
      }

      function flipbookZoom() {
        if (currentProjectViewer && typeof currentProjectViewer.zoom === "function") {
          currentProjectViewer.zoom();
        }
      }

      document.addEventListener("keydown", (event) => {
        const lightbox = document.getElementById("carousel-lightbox");
        const lightboxOpen = lightbox && lightbox.classList.contains("is-open");
        if (event.key === "Escape") {
          if (lightboxOpen) {
            closeCarouselZoom();
          } else {
            closeProjectModal();
          }
        } else if (lightboxOpen && event.key === "ArrowLeft") {
          lightboxPrev();
        } else if (lightboxOpen && event.key === "ArrowRight") {
          lightboxNext();
        }
      });

      document.getElementById("carousel-lightbox").addEventListener(
        "click",
        (event) => {
          if (event.target.id === "carousel-lightbox") closeCarouselZoom();
        },
      );

      (function () {
        const lightboxTrack = document.getElementById("carousel-lightbox-track");
        let lightboxScrollTimer = null;
        lightboxTrack.addEventListener("scroll", () => {
          clearTimeout(lightboxScrollTimer);
          lightboxScrollTimer = setTimeout(() => {
            if (!activeZoomCarouselId) return;
            const state = projectCarousels[activeZoomCarouselId];
            if (!state) return;
            const slideW = lightboxTrack.clientWidth || 1;
            const idx = Math.round(lightboxTrack.scrollLeft / slideW);
            state.setCurrent(Math.max(0, Math.min(state.count - 1, idx)));
          }, 80);
        });
      })();

      renderProjectsPage();
    </script>
  </body>
</html>
