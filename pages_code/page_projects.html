<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects – Charlie Cilla</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
      }

      header {
        width: 100%;
        background-color: black;
        z-index: 11;
        position: fixed;
        top: 0;
        left: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 40px;
        box-sizing: border-box;
      }

      .header-content {
        display: flex;
        align-items: center;
      }

      .logo {
        max-width: 50px;
        height: auto;
        margin-right: 20px;
      }

      h1 {
        margin: 0;
        color: white;
      }

      header ul {
        list-style-type: none;
        display: flex;
        margin: 0;
        padding: 0;
      }

      header ul li {
        margin-left: 20px;
      }

      header ul li a {
        color: white;
        text-decoration: none;
        transition: color 0.3s ease;
      }

      header ul li a:hover {
        color: #ff4444;
      }

      section {
        padding: 100px 20px 40px;
        max-width: 100%;
        margin: 0 auto;
        min-height: 100vh;
      }

      .project-list {
        text-align: center;
        margin-bottom: 50px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }

      .project-list button {
        background: none;
        color: white;
        border: 2px solid white;
        padding: 12px 24px;
        margin: 8px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 8px;
        transition: all 0.3s ease;
        font-weight: 500;
        letter-spacing: 0.5px;
      }

      .project-list button:hover {
        background: white;
        color: #111;
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
      }

      .project-list button:active {
        transform: translateY(0);
      }

      .project-display {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 60px;
        padding: 0 40px;
        max-width: 1800px;
        margin: 0 auto;
      }

      .project-description {
        flex: 1;
        max-width: 400px;
        min-width: 300px;
      }

      .project-description h2 {
        font-size: 36px;
        margin-bottom: 10px;
      }

      .project-description p {
        font-size: 18px;
        line-height: 1.5;
      }

      .project-images {
        flex: 3;
        display: flex;
        flex-direction: column;
        gap: 20px;
        max-width: 1200px;
      }

      .project-images img,
      .project-images iframe {
        width: 100%;
        height: auto;
        max-height: 700px;
        object-fit: contain;
        border-radius: 8px;
      }

      /* Special grid for Project 3 (WYAWYG) - overlapping poster style */
      .project-images.grid-5 {
        display: flex;
        flex-direction: row;
        justify-content: flex-start;
        align-items: center;
        gap: 0;
        padding: 20px 0;
        margin-left: 0;
      }

      .project-images.grid-5 img {
        width: 320px;
        height: auto;
        aspect-ratio: 1 / 1.5;
        object-fit: cover;
        border-radius: 4px;
        margin-left: -120px;
        box-shadow: -5px 5px 25px rgba(0, 0, 0, 0.6);
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease,
          z-index 0s;
        position: relative;
      }

      .project-images.grid-5 img:first-child {
        margin-left: 0;
      }

      .project-images.grid-5 img:hover {
        transform: scale(1.2) translateY(-10px);
        box-shadow: 0 15px 40px rgba(255, 255, 255, 0.2);
        z-index: 10;
      }

      /* Flipbook viewer styles */
      .flipbook-container {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      #flipbook-viewer {
        border-radius: 8px;
        overflow: hidden;
      }

      .flipbook-controls {
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .flipbook-controls button {
        background: none;
        color: white;
        border: 2px solid white;
        padding: 10px 20px;
        font-size: 14px;
        cursor: pointer;
        border-radius: 6px;
        transition: all 0.3s ease;
      }

      .flipbook-controls button:hover {
        background: white;
        color: #111;
      }

      .flipbook-page-info {
        color: #ccc;
        font-size: 14px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-content">
        <img src="../logo.png" alt="Logo" class="logo" />
        <h1>CHARLIE CILLA</h1>
      </div>
      <ul>
        <li><a href="../index.html">HOME</a></li>
        <li><a href="page_portfolio.html">ARCHIVES</a></li>
        <li><a href="page_contact.html">CONTACT</a></li>
        <li><a href="page_about.html">ABOUT</a></li>
        <li><a href="page_projects.html">PROJECTS</a></li>
      </ul>
    </header>

    <section>
      <div class="project-list" id="project-list"></div>
      <div class="project-display">
        <div class="project-description" id="description"></div>
        <div class="project-images" id="images">
          <!-- Visuals go here -->
        </div>
      </div>
    </section>

    <!-- PDF.js library for rendering PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Flipbook viewer library -->
    <script src="Handbook_Files/flipbook-viewer-master/dist/flipbook-viewer.js"></script>
    <!-- Admin panel scripts -->
    <link rel="stylesheet" href="../admin/admin.css" />
    <script src="../admin/data.js"></script>
    <script src="../admin/admin.js"></script>
    <script>
      // Set up PDF.js worker
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      const fallbackProjects = [
        {
          id: "project-1",
          title: "Student Meal Plan App Prototype",
          description: `University students face considerable difficulty when trying to manage their meal plans efficiently.<br> <br>
        Meal plans provide convenience but they fail to supply students with essential budgeting tools throughout an academic semester.<br> <br>
        Students frequently believe their meal plan money will last through the semester but unexpectedly find their funds depleted before the end.<br> <br>
        This leads to financial stress and dependence on expensive or low-nutrition food alternatives.`,
          type: "images",
          images: ["../Mealplan.jpg"],
        },
        {
          id: "project-2",
          title: "POWERADE Rebrand",
          description: `Powerade isn’t just a drink—it’s fuel for champions. But to lead the sports drink market, it must rediscover its roots. Athletes and sports enthusiasts may be the audience, but inspiration is missing. A brand without a story is a name without a legacy. <br> <br>

Born from the relentless spirit of runners—the athletes of speed and endurance—Powerade was once the pulse of those who lived to push limits. Young, driven, and unyielding, they found solace in a drink that matched their pace. But as Powerade expanded, its essence blurred, leaving behind the runners who first made it great. <br> <br>

The BIG IDEA is a return to origin—a bold resurgence of endurance, momentum, and the unbreakable will to go further. This isn’t just about hydration; it’s about igniting the fire of movement, the passion of pursuit, the thrill of crossing the finish line. The visual language will be daring, expressive, and explosive—a call to action for all who strive for greatness.
`,
          type: "images",
          images: [
            "../[GBDA 202] Rebranding Pitch-1_page-0001.jpg",
            "../[GBDA 202] Part 3 Rebranding Pitch-12 (1).jpg",
            "../[GBDA 202] Rebranding Pitch-16_page-0001.jpg",
          ],
        },
        {
          id: "project-3",
          title: "WYAWYG?",
          description: `Posters that demonstrate my <br> creativity as a desinger and artist. Each <br> poster is a digitization of a peice of art
        I <br>created in a physical medium. <br> <br> Each piece displays my ability to mold the <br> digital and physical worlds of design together, <br> creating something new .`,
          type: "images",
          images: [
            "../POSTER1 (1).jpg",
            "../POSTER1 (5).jpg",
            "../POSTER1 (2).jpg",
            "../POSTER1 (3).jpg",
            "../POSTER1 (4).jpg",
          ],
          displayStyle: "grid-5",
        },
        {
          id: "project-4",
          title: "Designer Handbook",
          description: `A comprehensive visual guide exploring the fundamental principles of design.<br><br>
        This handbook serves as both a personal reference and a creative exploration of typography, color theory, composition, and visual hierarchy.<br><br>
        Each spread demonstrates practical applications of design principles through carefully crafted layouts and thoughtful use of whitespace.`,
          type: "flipbook-images",
          flipbookImages: {
            basePath: "Handbook_Files/handbook-pages/page-",
            pageCount: 22,
            extension: ".png",
          },
        },
        {
          id: "project-5",
          title: "Voices 2026",
          description: `An immersive multimedia project capturing diverse perspectives and stories for the future.<br><br>
        Voices 2026 combines visual storytelling with audio narratives to create a time capsule of contemporary experiences.<br><br>
        The project explores themes of identity, community, and aspiration through a series of interviews and artistic interpretations.`,
          type: "images",
          images: ["../Mealplan.jpg"],
        },
      ];

      let projectsById = {};

      function normalizeProject(project) {
        const normalized = {
          id: project.id,
          title: project.title || "Untitled Project",
          description: project.description || "",
          displayStyle: project.displayStyle || "default",
          type: project.type || "images",
        };

        if (normalized.type === "images") {
          normalized.images = Array.isArray(project.images)
            ? project.images
            : [];
        } else if (normalized.type === "flipbook-images") {
          const fb = project.flipbookImages || {};
          normalized.flipbookImages = {
            basePath: "",
            pageCount: 1,
            extension: ".png",
            pdfPath: "",
            pages: [],
            ...fb,
          };
        } else if (normalized.type === "flipbook-pdf") {
          normalized.flipbook = project.flipbookPdf || project.flipbook || "";
        } else {
          normalized.images = Array.isArray(project.images)
            ? project.images
            : [];
        }

        return normalized;
      }

      function getProjectsData() {
        if (
          typeof AdminData !== "undefined" &&
          typeof AdminData.getProjects === "function"
        ) {
          return AdminData.getProjects().filter((p) => p.visible !== false);
        }
        return fallbackProjects;
      }

      function renderProjectButtons(projects) {
        const listEl = document.getElementById("project-list");
        if (!listEl) return;

        if (!projects.length) {
          listEl.innerHTML = "<p>No projects available.</p>";
          return;
        }

        listEl.innerHTML = projects
          .map(
            (p) =>
              `<button type="button" data-project-id="${p.id}">${p.title}</button>`,
          )
          .join("");

        listEl.querySelectorAll("button[data-project-id]").forEach((btn) => {
          btn.addEventListener("click", () => {
            showProject(btn.getAttribute("data-project-id"));
          });
        });
      }

      window.renderProjectsPage = function renderProjectsPage() {
        const sourceProjects = getProjectsData();
        const normalizedProjects = sourceProjects.map(normalizeProject);

        projectsById = normalizedProjects.reduce((acc, p) => {
          acc[p.id] = p;
          return acc;
        }, {});

        renderProjectButtons(normalizedProjects);

        if (normalizedProjects.length > 0) {
          showProject(normalizedProjects[0].id);
        } else {
          document.getElementById("description").innerHTML =
            "<h2>No projects</h2>";
          document.getElementById("images").innerHTML =
            "<p>No visuals available.</p>";
        }
      };

      // Global variable to track current flipbook viewer
      let currentViewer = null;

      function showProject(key) {
        const project = projectsById[key];
        if (!project) {
          return;
        }
        const imagesContainer = document.getElementById("images");

        // Clean up previous flipbook viewer if exists
        if (currentViewer) {
          currentViewer = null;
        }

        document.getElementById("description").innerHTML =
          `<h2>${project.title}</h2><p>${project.description}</p>`;

        // Reset images container classes
        imagesContainer.className = "project-images";

        if (project.displayStyle === "grid-5") {
          imagesContainer.classList.add("grid-5");
        }

        if (project.flipbookImages) {
          // Create flipbook viewer using pre-rendered images (fast!)
          imagesContainer.innerHTML = `
            <div class="flipbook-container">
              <div id="flipbook-viewer"></div>
              <div class="flipbook-controls">
                <button id="flip-prev">← Previous</button>
                <button id="flip-next">Next →</button>
                <button id="flip-zoom">Zoom</button>
              </div>
              <div class="flipbook-page-info" id="page-info">Loading...</div>
            </div>
          `;

          // Initialize the flipbook with images
          initFlipbookImages(project.flipbookImages);
        } else if (project.flipbook) {
          // Create flipbook viewer for PDF
          imagesContainer.innerHTML = `
            <div class="flipbook-container">
              <div id="flipbook-viewer"></div>
              <div class="flipbook-controls">
                <button id="flip-prev">← Previous</button>
                <button id="flip-next">Next →</button>
                <button id="flip-zoom">Zoom</button>
              </div>
              <div class="flipbook-page-info" id="page-info">Loading...</div>
            </div>
          `;

          // Initialize the flipbook
          initFlipbook(project.flipbook);
        } else if (project.images) {
          imagesContainer.innerHTML = project.images
            .map((src) => `<img src="${src}" alt="${project.title}">`)
            .join("");
        } else if (project.pdf) {
          imagesContainer.innerHTML = `
          <iframe src="${project.pdf}" type="application/pdf"></iframe>
        `;
        } else {
          imagesContainer.innerHTML = `<p>No visuals available.</p>`;
        }
      }

      // Initialize flipbook viewer with pre-rendered images (FAST!)
      function initFlipbookImages(config) {
        const pageInfo = document.getElementById("page-info");
        const flipViewerEl = document.getElementById("flipbook-viewer");
        pageInfo.textContent = "Loading...";

        const { basePath, pageCount, extension, pdfPath } = config;
        const selectedPages = Array.isArray(config.pages)
          ? config.pages.filter((p) => typeof p === "string" && p.trim())
          : [];
        const useSelectedPages = selectedPages.length > 0;
        const parsedPageCount = parseInt(pageCount, 10) || 1;
        const totalContentPages = useSelectedPages
          ? selectedPages.length
          : parsedPageCount;
        const cache = [];

        // Add empty page at start, black page at end
        // Index 0 = empty, Index 1-pageCount = actual pages, Index pageCount+1 = black
        const totalPages = totalContentPages + 2;

        // Create a black page image
        let blackPageCache = null;
        function getBlackPage(totalContentPagesForNumber = totalContentPages) {
          if (blackPageCache) return blackPageCache;
          const canvas = document.createElement("canvas");
          canvas.width = 1200;
          canvas.height = 1553;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#111111";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          const img = new Image();
          img.src = canvas.toDataURL();
          blackPageCache = {
            img,
            num: totalContentPagesForNumber + 1,
            width: canvas.width,
            height: canvas.height,
          };
          return blackPageCache;
        }

        // Preload page images
        function preloadImage(bookPageIndex) {
          return new Promise((resolve, reject) => {
            if (cache[bookPageIndex] !== undefined)
              return resolve(cache[bookPageIndex]);

            // Index 0 = empty (no page)
            if (bookPageIndex === 0) {
              cache[bookPageIndex] = null;
              return resolve(null);
            }

            const img = new Image();
            if (useSelectedPages) {
              img.src = selectedPages[bookPageIndex - 1];
            } else {
              // File pages are 1-based (page-01.png)
              const filePageNum = bookPageIndex;
              const paddedNum = String(filePageNum).padStart(2, "0");
              img.src = `${basePath}${paddedNum}${extension}`;
            }

            img.onload = () => {
              cache[bookPageIndex] = {
                img,
                num: bookPageIndex,
                width: img.width,
                height: img.height,
              };
              resolve(cache[bookPageIndex]);
            };
            img.onerror = () => reject(`Failed to load page ${bookPageIndex}`);
          });
        }

        // Pre-render a PDF page to a PNG data URL image for fast flipping.
        function renderPdfPageToImage(pdf, pdfPageNum) {
          return new Promise((resolve, reject) => {
            if (cache[pdfPageNum] !== undefined) {
              return resolve(cache[pdfPageNum]);
            }

            pdf
              .getPage(pdfPageNum)
              .then((page) => {
                const viewport = page.getViewport({ scale: 1.0 });
                const canvas = document.createElement("canvas");
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                return page
                  .render({
                    canvasContext: canvas.getContext("2d"),
                    viewport,
                  })
                  .promise.then(() => {
                    const img = new Image();
                    img.onload = () => {
                      cache[pdfPageNum] = {
                        img,
                        num: pdfPageNum,
                        width: img.width,
                        height: img.height,
                      };
                      resolve(cache[pdfPageNum]);
                    };
                    img.onerror = () =>
                      reject(`Failed to prerender page ${pdfPageNum}`);
                    img.src = canvas.toDataURL("image/png");
                  });
              })
              .catch((err) => reject(err));
          });
        }

        // Create book interface
        const book = {
          numPages: () => totalPages,
          getPage: (n, cb) => {
            // Return nothing for empty slots or out of bounds
            if (n < 0 || n >= totalPages) return cb();
            if (n === 0) return cb(); // Empty slot at start
            if (n > totalContentPages) return cb(null, getBlackPage()); // Black page at end

            if (cache[n]) return cb(null, cache[n]);

            preloadImage(n)
              .then((result) => {
                if (result) cb(null, result);
                else cb();
              })
              .catch((err) => cb(err));
          },
        };

        function initViewerWithPreparedPages(totalContentPages, preloadFn) {
          const initialPages = Math.min(5, totalContentPages);
          const preloadPromises = [];
          for (let i = 1; i <= initialPages; i++) {
            preloadPromises.push(preloadFn(i));
          }

          Promise.all(preloadPromises)
            .then(() => {
              // Calculate responsive size
              const containerWidth = flipViewerEl.parentElement.offsetWidth;
              const width = Math.min(900, containerWidth - 40);
              const height = Math.floor(width * 0.7);

              const opts = {
                width: width,
                height: height,
                backgroundColor: "#111111",
                boxColor: "#111111",
                boxBorder: 0,
              };

              flipbook.init(book, flipViewerEl, opts, (err, viewer) => {
                if (err) {
                  console.error(err);
                  pageInfo.textContent = "Error loading flipbook";
                  return;
                }

                currentViewer = viewer;
                pageInfo.textContent = `Page 1 of ${totalContentPages}`;

                // Track page views
                viewer.on("seen", (n) => {
                  const displayPage = Math.max(
                    1,
                    Math.min(n, totalContentPages),
                  );
                  pageInfo.textContent = `Page ${displayPage} of ${totalContentPages}`;
                  // Preload next pages when viewing
                  for (let i = 1; i <= 4; i++) {
                    if (n + i <= totalContentPages) preloadFn(n + i);
                  }
                });

                // Set up controls
                document.getElementById("flip-next").onclick = () =>
                  viewer.flip_forward();
                document.getElementById("flip-prev").onclick = () =>
                  viewer.flip_back();
                document.getElementById("flip-zoom").onclick = () =>
                  viewer.zoom();

                // Preload remaining pages in background
                for (let i = initialPages + 1; i <= totalContentPages; i++) {
                  setTimeout(() => preloadFn(i), (i - initialPages) * 100);
                }
              });
            })
            .catch((err) => {
              console.error("Failed to load images:", err);
              pageInfo.textContent = "Failed to load handbook";
            });
        }

        if (pdfPath) {
          pageInfo.textContent = "Loading PDF and prerendering pages...";
          pdfjsLib
            .getDocument(pdfPath)
            .promise.then((pdf) => {
              const totalPdfPages = pdf.numPages;
              const totalPdfBookPages = totalPdfPages + 2;

              const pdfBook = {
                numPages: () => totalPdfBookPages,
                getPage: (n, cb) => {
                  if (n < 0 || n >= totalPdfBookPages) return cb();
                  if (n === 0) return cb();
                  if (n > totalPdfPages)
                    return cb(null, getBlackPage(totalPdfPages));

                  if (cache[n]) return cb(null, cache[n]);

                  renderPdfPageToImage(pdf, n)
                    .then((result) => cb(null, result))
                    .catch((err) => cb(err));
                },
              };

              book.numPages = pdfBook.numPages;
              book.getPage = pdfBook.getPage;
              initViewerWithPreparedPages(totalPdfPages, (n) =>
                renderPdfPageToImage(pdf, n),
              );
            })
            .catch((err) => {
              console.error("Failed to load PDF for prerender:", err);
              pageInfo.textContent = "Failed to prerender PDF";
            });
          return;
        }

        initViewerWithPreparedPages(totalContentPages, preloadImage);
      }

      // Initialize flipbook viewer with PDF
      function initFlipbook(pdfPath) {
        const pageInfo = document.getElementById("page-info");
        const flipViewerEl = document.getElementById("flipbook-viewer");
        pageInfo.textContent = "Loading PDF...";

        // Page cache and render queue
        const cache = [];
        const pendingCallbacks = {};
        let isRendering = false;
        const renderQueue = [];

        // Process render queue one at a time to avoid overwhelming the browser
        function processRenderQueue() {
          if (isRendering || renderQueue.length === 0) return;
          isRendering = true;
          const { pdf, n, cb } = renderQueue.shift();

          renderPage(pdf, n, (err, result) => {
            isRendering = false;
            if (cb) cb(err, result);
            // Continue processing queue
            setTimeout(processRenderQueue, 10);
          });
        }

        // Render a single page
        function renderPage(pdf, n, cb) {
          pdf
            .getPage(n)
            .then((page) => {
              // Use lower scale for faster rendering
              const scale = 1.0;
              const viewport = page.getViewport({ scale });

              const canvas = document.createElement("canvas");
              canvas.width = viewport.width;
              canvas.height = viewport.height;

              const context = canvas.getContext("2d");
              const renderContext = {
                canvasContext: context,
                viewport,
              };

              page
                .render(renderContext)
                .promise.then(() => {
                  // Create image from canvas
                  const img = new Image();
                  img.onload = () => {
                    cache[n] = {
                      img,
                      num: n,
                      width: img.width,
                      height: img.height,
                    };
                    cb(null, cache[n]);
                  };
                  img.onerror = () => cb("Failed to load image");
                  img.src = canvas.toDataURL("image/jpeg", 0.85); // JPEG is faster than PNG
                })
                .catch((err) => cb(err));
            })
            .catch((err) => cb(err));
        }

        // Pre-cache pages in background
        function precachePages(pdf, startPage, count) {
          for (let i = 0; i < count && startPage + i <= pdf.numPages; i++) {
            const pageNum = startPage + i;
            if (!cache[pageNum] && !pendingCallbacks[pageNum]) {
              pendingCallbacks[pageNum] = true;
              renderQueue.push({
                pdf,
                n: pageNum,
                cb: () => {
                  delete pendingCallbacks[pageNum];
                },
              });
            }
          }
          processRenderQueue();
        }

        pdfjsLib
          .getDocument(pdfPath)
          .promise.then((pdf) => {
            const book = {
              pdf: pdf,
              numPages: () => pdf.numPages,
              getPage: (n, cb) => {
                if (!n || n > pdf.numPages) return cb();
                if (cache[n]) return cb(null, cache[n]);

                // Priority render for requested page
                renderPage(pdf, n, (err, result) => {
                  cb(err, result);
                  // Pre-cache next few pages
                  precachePages(pdf, n + 1, 4);
                });
              },
            };

            // Calculate responsive size
            const containerWidth = flipViewerEl.parentElement.offsetWidth;
            const width = Math.min(900, containerWidth - 40);
            const height = Math.floor(width * 0.7);

            const opts = {
              width: width,
              height: height,
              backgroundColor: "#353535",
            };

            // Pre-cache first few pages before initializing
            pageInfo.textContent = "Preparing pages...";

            // Render first 4 pages, then initialize flipbook
            let pagesReady = 0;
            const pagesToPreload = Math.min(4, pdf.numPages);

            for (let i = 1; i <= pagesToPreload; i++) {
              renderPage(pdf, i, () => {
                pagesReady++;
                pageInfo.textContent = `Loading page ${pagesReady}/${pagesToPreload}...`;

                if (pagesReady === pagesToPreload) {
                  // All initial pages ready, start flipbook
                  flipbook.init(book, flipViewerEl, opts, (err, viewer) => {
                    if (err) {
                      console.error(err);
                      pageInfo.textContent = "Error loading flipbook";
                      return;
                    }

                    currentViewer = viewer;
                    pageInfo.textContent = `Page 1 of ${viewer.page_count}`;

                    // Track page views
                    viewer.on("seen", (n) => {
                      pageInfo.textContent = `Page ${n} of ${viewer.page_count}`;
                    });

                    // Set up controls
                    document.getElementById("flip-next").onclick = () =>
                      viewer.flip_forward();
                    document.getElementById("flip-prev").onclick = () =>
                      viewer.flip_back();
                    document.getElementById("flip-zoom").onclick = () =>
                      viewer.zoom();

                    // Continue pre-caching remaining pages in background
                    precachePages(pdf, 5, pdf.numPages - 4);
                  });
                }
              });
            }
          })
          .catch((err) => {
            console.error("Failed to load PDF:", err);
            pageInfo.textContent = "Failed to load PDF";
          });
      }

      // Initial render
      window.renderProjectsPage();
    </script>
  </body>
</html>
