<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archive - Charlie Cilla</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        --bg: #ffffff;
        --text: #0d0d0d;
        --muted: #3a3a3a;
        --faint: #8a8a84;
        --line: #dadada;
        --link-blue: #1237c4;
        --link-purple: #63239e;
        --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
        --serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--serif);
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: var(--link-blue);
      }

      img {
        display: block;
        max-width: 100%;
        height: auto;
      }

      .page {
        width: 100%;
        margin: 0;
        padding: 36px clamp(24px, 4vw, 64px) 70px;
        position: relative;
      }

      .top-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 6px;
        font-family: var(--mono);
        font-size: 0.78rem;
      }

      .top-row a {
        color: var(--text);
        text-decoration: none;
      }

      .top-row a:hover {
        color: var(--link-blue);
      }

      .corner-label {
        font-size: 0.8rem;
        font-style: italic;
        color: var(--muted);
        text-align: right;
      }

      .page-title {
        font-size: 2.4rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 34px 0 6px;
      }

      .page-dek {
        color: var(--muted);
        font-size: 0.94rem;
        max-width: 56ch;
        margin-bottom: 14px;
      }

      .count {
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--faint);
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 10px 0;
        margin-bottom: 44px;
      }

      .cols {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 36px;
      }

      .entry {
        margin-bottom: 30px;
      }

      .entry a.title-link {
        display: block;
        color: var(--link-purple);
        text-decoration: underline;
        font-size: 0.98rem;
        margin-bottom: 8px;
      }

      .entry a.title-link.blue {
        color: var(--link-blue);
      }

      .thumb {
        border: 1px solid var(--line);
        background: #f4f4f2;
        aspect-ratio: 4 / 5;
        overflow: hidden;
        margin-bottom: 6px;
      }

      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .idx {
        font-family: var(--mono);
        font-size: 0.7rem;
        color: var(--faint);
      }

      .page-footer {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 0.78rem;
      }

      .page-footer a {
        color: var(--text);
        text-decoration: none;
      }

      .page-footer a:hover {
        color: var(--link-blue);
      }

      .list-empty {
        font-family: var(--mono);
        font-size: 0.8rem;
        color: var(--faint);
        grid-column: 1 / -1;
      }

      @media (max-width: 900px) {
        .cols {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 600px) {
        .cols {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="top-row">
        <a href="../index.html">&larr; home</a>
        <span class="corner-label">charlie cilla<br />design + film</span>
      </div>

      <h1 class="page-title">Archive</h1>
      <p class="page-dek">
        Poster, collage, print, and mixed-media work outside the featured
        selection &mdash; a running record, not a highlight reel.
      </p>
      <p class="count" id="archive-count"></p>

      <div class="cols" id="archive-cols">
        <div class="col" id="col-left"></div>
        <div class="col" id="col-middle"></div>
        <div class="col" id="col-right"></div>
      </div>

      <div class="page-footer">
        <a href="../index.html">&larr; back to selected works</a>
      </div>
    </div>

    <link rel="stylesheet" href="../admin/admin.css" />
    <script src="../admin/data.js"></script>
    <script src="../admin/admin.js"></script>
    <script>
      function renderArchivePage() {
        const projects = AdminData.getArchiveProjects().filter(
          (p) => p.visible !== false,
        );
        const cols = {
          left: document.getElementById("col-left"),
          middle: document.getElementById("col-middle"),
          right: document.getElementById("col-right"),
        };

        document.getElementById("archive-count").textContent =
          `${String(projects.length).padStart(2, "0")} entries · sorted by column`;

        if (!projects.length) {
          document.getElementById("archive-cols").innerHTML =
            '<p class="list-empty">No archive projects available.</p>';
          return;
        }

        projects.forEach((project, idx) => {
          const col = cols[project.column] || cols.left;
          const idxLabel = String(idx + 1).padStart(2, "0");
          const linkClass = idx % 2 === 0 ? "" : "blue";
          const href = project.detailPagePath || "#";

          const entry = document.createElement("div");
          entry.className = "entry";
          entry.innerHTML = `
            <span class="idx">${idxLabel}.</span>
            <a class="title-link ${linkClass}" href="${href}">${project.title || "Untitled"}</a>
            <a class="thumb" href="${href}">
              <img src="${project.imagePath}" alt="${project.title || "Archive image"}" loading="lazy" />
            </a>
          `;
          col.appendChild(entry);
        });
      }

      renderArchivePage();
    </script>
  </body>
</html>
