<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archives - Charlie Cilla</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="../site-theme.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      .archive-hero {
        margin: 8px 0 32px;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: clamp(32px, 10vw, 150px);
        line-height: 0.9;
        letter-spacing: -3px;
        text-transform: uppercase;
        font-weight: 900;
        color: #fff;
        white-space: nowrap;
      }

      .archive-hero .accent-stroke {
        -webkit-text-stroke: 1.5px var(--accent);
        color: transparent;
      }

      .archive-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 22px;
      }

      .archive-card {
        display: grid;
        gap: 12px;
        text-decoration: none;
        color: inherit;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(8, 8, 8, 0.42);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        padding: 14px;
        transition:
          border-color 0.2s ease,
          transform 0.2s ease,
          background 0.2s ease;
      }

      .archive-card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
        background: rgba(12, 12, 12, 0.6);
      }

      .archive-card-media {
        width: 100%;
        aspect-ratio: 4 / 5;
        overflow: hidden;
        background: #050505;
      }

      .archive-card-media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .archive-card-idx {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 2px;
        color: var(--accent);
        text-transform: uppercase;
      }

      .archive-card-title {
        margin: 0;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: clamp(16px, 2vw, 22px);
        line-height: 1.06;
        text-transform: uppercase;
        font-weight: 900;
        letter-spacing: -0.3px;
      }

      .archive-empty {
        border: 1px dashed rgba(255, 255, 255, 0.2);
        padding: 40px;
        text-align: center;
        color: #9a9a9a;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-size: 12px;
        font-family: var(--mono);
        grid-column: 1 / -1;
      }

      @media (max-width: 980px) {
        .archive-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 650px) {
        .archive-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="site-bg" aria-hidden="true">
      <video class="site-bg-video" autoplay muted loop playsinline>
        <source src="../Assets/tree-background.mp4" type="video/mp4" />
      </video>
      <div class="site-bg-overlay"></div>
      <div class="site-bg-grain"></div>
      <div class="site-bg-fade"></div>
    </div>

    <header class="site-header">
      <div class="header-content">
        <img src="../logo.png" alt="Logo" class="logo" />
        <h1 class="brand-title">CHARLIE CILLA</h1>
      </div>
      <ul class="site-nav">
        <li><a href="../index.html">HOME</a></li>
        <li><a href="page_portfolio.html" class="is-active">ARCHIVES</a></li>
        <li><a href="page_contact.html">CONTACT</a></li>
        <li><a href="page_about.html">ABOUT</a></li>
        <li><a href="page_projects.html">PROJECTS</a></li>
      </ul>
    </header>

    <main class="page-shell">
      <div class="meta-strip">
        <div>Charlie Cilla / Archives<br />Image + Print + Mixed Media</div>
        <div>Selected Experiments<br />Visual Studies 2022—Present</div>
        <div>A curated stream of poster, collage, and mixed media work.</div>
      </div>

      <h2 class="archive-hero">
        <span class="accent-stroke">The</span> Archives
      </h2>

      <section class="archive-grid" id="archive-grid"></section>
    </main>

    <footer class="site-footer">&copy; 2026 Charlie Cilla</footer>

    <link rel="stylesheet" href="../admin/admin.css" />
    <script src="../admin/data.js"></script>
    <script src="../admin/admin.js"></script>
    <script>
      function renderArchivePage() {
        const projects = AdminData.getArchiveProjects().filter(
          (p) => p.visible !== false,
        );
        const grid = document.getElementById("archive-grid");

        if (!projects.length) {
          grid.innerHTML =
            '<div class="archive-empty">No archive projects available.</div>';
          return;
        }

        grid.innerHTML = projects
          .map((project, idx) => {
            const href = project.detailPagePath || "#";
            const target = href === "#" ? "" : `href="${href}"`;
            const idxLabel = String(idx + 1).padStart(2, "0");
            const totalLabel = String(projects.length).padStart(2, "0");
            return `
              <a class="archive-card" ${target}>
                <div class="archive-card-media">
                  <img src="${project.imagePath}" alt="${project.title || "Archive image"}" loading="lazy" />
                </div>
                <span class="archive-card-idx">${idxLabel} / ${totalLabel}</span>
                <h3 class="archive-card-title">${project.title || "Untitled"}</h3>
              </a>
            `;
          })
          .join("");
      }

      renderArchivePage();
    </script>
  </body>
</html>
