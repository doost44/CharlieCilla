<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles.css" />
    <title>Charlie Cilla - Archives</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: #000;
        color: #fff;
      }

      header {
        width: 100%;
        background-color: black;
        z-index: 11;
        position: fixed;
        top: 0;
        left: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 40px;
        box-sizing: border-box;
      }

      .header-content {
        display: flex;
        align-items: center;
      }

      .logo {
        max-width: 50px;
        height: auto;
        margin-right: 20px;
      }

      h1 {
        margin: 0;
        color: white;
      }

      header ul {
        list-style-type: none;
        display: flex;
        margin: 0;
        padding: 0;
      }

      header ul li {
        margin-left: 20px;
      }

      header ul li a {
        color: white;
        text-decoration: none;
        transition: color 0.3s ease;
      }

      header ul li a:hover {
        color: #ff4444;
      }

      .container {
        display: flex;
        max-width: 1400px;
        margin: 100px auto 40px;
        padding: 20px 40px;
        gap: 30px;
        justify-content: center;
      }

      .left-column,
      .middle-column,
      .right-column {
        flex: 1;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        gap: 30px;
      }

      .left-column a,
      .middle-column a,
      .right-column a {
        display: block;
        overflow: visible;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
        position: relative;
      }

      .left-column a:hover,
      .middle-column a:hover,
      .right-column a:hover {
        transform: scale(1.2);
        z-index: 10;
        box-shadow: 0 8px 30px rgba(255, 255, 255, 0.2);
      }

      .left-column img,
      .middle-column img,
      .right-column img {
        width: 100%;
        height: auto;
        max-height: 500px;
        object-fit: cover;
        display: block;
      }

      .left-column a:hover img,
      .middle-column a:hover img,
      .right-column a:hover img {
        transform: scale(1.05);
      }

      .page-title {
        text-align: center;
        margin-top: 100px;
        margin-bottom: -40px;
        font-size: 36px;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-content">
        <img src="../logo.png" alt="Logo" class="logo" />
        <h1>CHARLIE CILLA</h1>
      </div>
      <ul>
        <li><a href="../index.html">HOME</a></li>
        <li><a href="page_portfolio.html">ARCHIVES</a></li>
        <li><a href="page_contact.html">CONTACT</a></li>
        <li><a href="page_about.html">ABOUT</a></li>
        <li><a href="page_projects.html">PROJECTS</a></li>
      </ul>
    </header>

    <h2 class="page-title">ARCHIVES</h2>

    <div class="container">
      <div class="left-column" id="archive-left"></div>
      <div class="middle-column" id="archive-middle"></div>
      <div class="right-column" id="archive-right"></div>
    </div>

    <footer style="text-align: center; padding: 30px 20px; color: #333;">
      <span style="color: #444; font-size: 11px;">&copy; 2025 Charlie Cilla</span>
    </footer>

    <!-- Admin Panel Scripts -->
    <link rel="stylesheet" href="../admin/admin.css">
    <script src="../admin/data.js"></script>
    <script src="../admin/admin.js"></script>
    <script>
      // Render archive page projects dynamically
      function renderArchivePage() {
        const projects = AdminData.getArchiveProjects().filter(p => p.visible);

        const leftProjects = projects.filter(p => p.column === 'left');
        const middleProjects = projects.filter(p => p.column === 'middle');
        const rightProjects = projects.filter(p => p.column === 'right');

        function renderColumn(columnProjects) {
          return columnProjects.map(p => `
            <a href="${p.detailPagePath}">
              <img src="${p.imagePath}" alt="${p.title}" />
            </a>
          `).join('');
        }

        document.getElementById('archive-left').innerHTML = renderColumn(leftProjects);
        document.getElementById('archive-middle').innerHTML = renderColumn(middleProjects);
        document.getElementById('archive-right').innerHTML = renderColumn(rightProjects);
      }

      // Initial render
      renderArchivePage();
    </script>
  </body>
</html>
