    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: #000;
        color: #fff;
      }

      header {
        width: 100%;
        background-color: black;

      header ul li {

      header ul li a {
        color: white;

      header ul li a:hover {
        color: #ff4444;
      }

      .container {
        display: flex;
        max-width: 1200px;
        margin: 100px auto 0;
        padding: 40px;
        gap: 60px;
        justify-content: center;
        align-items: flex-start;
      }

      .left-column {
        flex: 1;
        max-width: 450px;
      }

      .right-column {
        flex: 1;
        max-width: 500px;
      }

      .left-column img {
        width: 100%;
        height: auto;
        border-radius: 12px;
        box-shadow: 0 8px 25px rgba(255, 255, 255, 0.1);
      }

      .right-column h2 {
        text-align: left;
        margin-bottom: 20px;
        font-size: 28px;
        border-bottom: 2px solid #333;
        padding-bottom: 10px;
      }

      .right-column p {
        color: #ddd;
        margin-bottom: 10px;
      }

      .right-column a {
        color: #ffffff;
        text-decoration: none;
        transition: color 0.3s ease;
      }

      .right-column a:hover {
        color: #ff4444;
      }

      .social-icons {
        display: flex;
        gap: 15px;
        margin-top: 15px;
        margin-bottom: 40px;
      }

      .social-icons a {
        display: inline-block;
        transition: transform 0.3s ease;
      }

      .social-icons a:hover {
        transform: scale(1.1);
      }

      .social-icons img {
        width: 35px;
        height: 35px;
        border-radius: 8px;
      }

      .right-column form {
        display: flex;
        flex-direction: column;
      }

      .right-column form label {
        margin: 15px 0 8px;
        font-size: 14px;
        color: #aaa;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .right-column form input,
      .right-column form textarea {
        padding: 14px 16px;
        border: none;
        margin-bottom: 5px;
        border-radius: 8px;
        background-color: #1a1a1a;
        color: #fff;
        font-size: 16px;
        border: 1px solid #333;
        transition:
          border-color 0.3s ease,
          box-shadow 0.3s ease;
      }

      .right-column form input:focus,
      .right-column form textarea:focus {
        outline: none;
        border-color: #ff4444;
        box-shadow: 0 0 10px rgba(255, 68, 68, 0.2);
      }

      .right-column form textarea {
        resize: vertical;
        min-height: 120px;
      }

      .right-column form button {
        margin-top: 20px;
        padding: 14px 30px;
        background-color: #ff4444;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.3s ease;
      }

      .right-column form button:hover {
        background-color: #cc3333;
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(255, 68, 68, 0.3);
      }

      .right-column form button:active {
        transform: translateY(0);
      }
    </style>

    <header>
      <div class="header-content">

    <div class="container">
      <div class="left-column">
        <img src="../A5_Charlie_Cilla_Paradox.jpg" alt="Profile" />
      </div>

      <div class="right-column">
        <h2>Contact Information</h2>
        <p>
          Email:
          <a href="mailto:charlievcilla@gmail.com">charlievcilla@gmail.com</a>
        </p>
        <p>Follow me on social media:</p>
        <div class="social-icons">
          <a href="https://www.instagram.com/charlie_cilla/" target="_blank">
            <img src="../instagram.png" alt="Instagram" />
          </a>
          <a
            href="https://www.linkedin.com/in/charlie-cilla-122038243/"
            target="_blank"
          >
            <img src="../linkedin.webp" alt="LinkedIn" />
          </a>
        </div>

        <h2>Send a Message</h2>
        <form action="submit_form.php" method="post">
          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Your name"
            required
          />

          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="your@email.com"
            required
          />

          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            placeholder="Your message..."
            required
          ></textarea>

          <button type="submit">Send Message</button>
        </form>
      </div>
    </div>
