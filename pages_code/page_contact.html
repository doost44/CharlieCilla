<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Charlie Cilla</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        --bg: #ffffff;
        --text: #0d0d0d;
        --muted: #3a3a3a;
        --faint: #8a8a84;
        --line: #dadada;
        --link-blue: #1237c4;
        --link-purple: #63239e;
        --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
        --serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--serif);
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: var(--link-blue);
      }

      img {
        display: block;
        max-width: 100%;
        height: auto;
      }

      .page {
        width: 100%;
        margin: 0;
        padding: 36px clamp(24px, 4vw, 64px) 70px;
        position: relative;
      }

      .top-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 6px;
        font-family: var(--mono);
        font-size: 0.78rem;
      }

      .top-row a {
        color: var(--text);
        text-decoration: none;
      }

      .top-row a:hover {
        color: var(--link-blue);
      }

      .corner-label {
        font-size: 0.8rem;
        font-style: italic;
        color: var(--muted);
        text-align: right;
      }

      .page-title {
        font-size: 2.4rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 34px 0 44px;
      }

      .contact-layout {
        display: grid;
        grid-template-columns: 0.8fr 1.2fr;
        gap: 48px;
      }

      .contact-image {
        border: 1px solid var(--line);
        overflow: hidden;
      }

      .contact-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        min-height: 420px;
      }

      .contact-section {
        margin-bottom: 34px;
        max-width: 62ch;
      }

      .contact-section h2 {
        font-family: var(--mono);
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--faint);
        margin: 0 0 10px;
        font-weight: 500;
      }

      .contact-section p {
        margin: 0 0 8px;
        color: var(--muted);
        line-height: 1.75;
        font-size: 0.95rem;
      }

      .socials {
        display: flex;
        gap: 16px;
        margin-top: 6px;
        font-size: 0.9rem;
      }

      .contact-form {
        display: grid;
        gap: 4px;
        max-width: 46ch;
      }

      .contact-form label {
        font-family: var(--mono);
        font-size: 0.68rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--faint);
        margin-top: 14px;
      }

      .contact-form label:first-child {
        margin-top: 0;
      }

      .contact-form input,
      .contact-form textarea {
        background: #fff;
        color: var(--text);
        border: 1px solid var(--line);
        padding: 10px 12px;
        font-family: var(--serif);
        font-size: 0.92rem;
      }

      .contact-form input:focus,
      .contact-form textarea:focus {
        outline: none;
        border-color: var(--link-blue);
      }

      .contact-form textarea {
        resize: vertical;
        min-height: 120px;
      }

      .contact-form button {
        margin-top: 20px;
        width: fit-content;
        border: 1px solid var(--text);
        background: #fff;
        color: var(--text);
        padding: 10px 20px;
        cursor: pointer;
        font-family: var(--mono);
        font-size: 0.75rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .contact-form button:hover {
        background: var(--text);
        color: #fff;
      }

      .page-footer {
        margin-top: 50px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 0.78rem;
      }

      .page-footer a {
        color: var(--text);
        text-decoration: none;
      }

      .page-footer a:hover {
        color: var(--link-blue);
      }

      @media (max-width: 800px) {
        .contact-layout {
          grid-template-columns: 1fr;
        }
        .contact-image img {
          min-height: 320px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="top-row">
        <a href="../index.html">&larr; home</a>
        <span class="corner-label">charlie cilla<br />design + film</span>
      </div>

      <h1 class="page-title">Get in touch</h1>

      <section class="contact-layout">
        <div class="contact-image">
          <img src="../A5_Charlie_Cilla_Paradox.jpg" alt="Contact visual" />
        </div>

        <div class="contact-content">
          <div class="contact-section">
            <h2>Reach Out</h2>
            <p>
              Email:
              <a href="mailto:charlievcilla@gmail.com">charlievcilla@gmail.com</a>
            </p>
            <p>Open for collaborations, commissions, and freelance work. Remote friendly, based Toronto / Waterloo.</p>
            <div class="socials">
              <a href="https://www.instagram.com/d0o0st/" target="_blank" rel="noopener">instagram</a>
              <a href="https://www.linkedin.com/in/charlie-cilla-122038243/" target="_blank" rel="noopener">linkedin</a>
            </div>
          </div>

          <div class="contact-section">
            <h2>Send a Message</h2>
            <form class="contact-form" action="submit_form.php" method="post">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" placeholder="Your name" required />

              <label for="email">Email</label>
              <input type="email" id="email" name="email" placeholder="your@email.com" required />

              <label for="message">Message</label>
              <textarea id="message" name="message" rows="5" placeholder="Your message..." required></textarea>

              <button type="submit">Send Message</button>
            </form>
          </div>
        </div>
      </section>

      <div class="page-footer">
        <a href="../index.html">&larr; back to selected works</a>
      </div>
    </div>
  </body>
</html>
